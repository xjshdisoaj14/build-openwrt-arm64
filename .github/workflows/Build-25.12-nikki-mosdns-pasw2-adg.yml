name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite + HTTPS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          # 移除不存在的 abuild，保留必要的编译与解压工具
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip openssl

      - name: Download & Extract ImageBuilder (25.12.1 Direct)
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)
          
          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder！"
            exit 1
          fi
          
          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading: ${DOWNLOAD_URL}"
          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder
          
          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      - name: Download & Integrate Offline Packages
        run: |
          mkdir -p builder/packages
          cd builder/packages

          download_assets() {
            local repo=$1
            local pattern=$2
            echo "==> Fetching assets from $repo..."
            local urls=$(curl -sL "https://api.github.com/repos/$repo/releases/latest" | jq -r '.assets[].browser_download_url // empty')
            [ -z "$urls" ] && return 0
            
            for url in $urls; do
              if [[ "$url" != *.apk ]]; then continue; fi
              if [ -n "$pattern" ] && ! echo "$url" | grep -qiE "$pattern"; then continue; fi
              
              echo "Downloading: $url"
              curl -sSL -O "$url" || true
            done
          }

          download_assets "nikkinikki-org/OpenWrt-nikki" "aarch64|noarch|all"
          download_assets "sbwml/luci-app-mosdns" "aarch64|noarch|all"
          download_assets "Openwrt-Passwall/openwrt-passwall2" "passwall2.*(aarch64|noarch|all)"
          download_assets "asv1st/luci-app-adguardhome" "aarch64|noarch|all"

          echo "==> Filtering non-ARM64 packages..."
          for apk_file in *.apk; do
            [ -f "$apk_file" ] || continue
            ARCH=$(tar -xzOf "$apk_file" .PKGINFO 2>/dev/null | grep '^arch =' | awk '{print $3}')
            if [[ "$ARCH" != "aarch64" && "$ARCH" != "noarch" && "$ARCH" != "all" ]]; then
              echo "❌ Removing incompatible arch ($ARCH): $apk_file"
              rm -f "$apk_file"
            else
              echo "✅ Keeping ($ARCH): $apk_file"
            fi
          done
          
          ls -la *.apk || echo "No local APKs found."

      - name: Sign Local APK Repository & Generate Index
        run: |
          cd builder
          
          # 提取 IB 内置构建密钥
          KEY_BUILD=$(find . -maxdepth 2 -name "key-build" -type f | head -n 1)
          KEY_BUILD_PUB=$(find . -maxdepth 2 -name "key-build.pub" -type f | head -n 1)
          
          if [ -z "$KEY_BUILD" ] || [ -z "$KEY_BUILD_PUB" ]; then
            echo "::error::Cannot find key-build or key-build.pub in ImageBuilder!"
            exit 1
          fi
          
          echo "Using build key: $KEY_BUILD"
          
          # 将公钥注入最终 rootfs 的信任池
          mkdir -p files/etc/apk/keys/
          cp "$KEY_BUILD_PUB" files/etc/apk/keys/
          
          # 【核心修复】直接使用 IB 自带的 make package_index
          # ImmortalWrt IB 的 Makefile 内部已封装好 apk 签名逻辑
          # 它会自动使用 key-build 对 packages/ 下的 apk 重签并生成合法的 packages.adb
          echo "==> Generating signed packages.adb via ImageBuilder internals..."
          make package_index

      - name: Integrate AdGuard Home Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.77/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      - name: Configure AdGuard Home Service
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common
          START=99
          STOP=10
          USE_PROCD=1
          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome
          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_close_instance
          }
          EOF
          chmod +x builder/files/etc/init.d/adguardhome

      - name: Build RootFS
        run: |
          cd builder
          
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci luci-i18n-base-zh-cn luci-theme-argon \
            vsftpd openssh-sftp-server \
            nikki luci-app-nikki luci-i18n-nikki-zh-cn \
            mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn \
            luci-app-passwall2 luci-i18n-passwall2-zh-cn \
            adguardhome luci-app-adguardhome \
            luci-app-acme luci-i18n-acme-zh-cn openssl-util px5g-standalone \
            luci-i18n-smartdns-zh-cn luci-app-vlmcsd luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq"

          # ADD_LOCAL_KEY=1 确保编译期信任本地重签名的包
          make image PROFILE="generic" \
            PACKAGES="$PACKAGES" \
            FILES="files" \
            ADD_LOCAL_KEY=1 \
            -j$(nproc)

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS
          body: |
            ## ImmortalWrt 25.12.1 (ARMSR / armv8) Auto Build
            - **Arch / Pkg Manager**: ARMSR (ARM64) / APK
            - **Built-in Components**: PassWall2, Nikki, MosDNS, AdGuardHome, ACME
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build ImmortalWrt 25.12.1 (ARMSR + Full Proxy Suite)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月 1 日 0:00 触发 (北京时间 08:00)
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      # 3. 提取 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$TARGET_DIR")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::目标路径 $TARGET_DIR 返回 HTTP $HTTP_CODE，尝试使用 snapshots 路径..."
            TARGET_DIR="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/"
          fi

          echo "Connecting to target repository: ${TARGET_DIR}"
          HTML_CONTENT=$(curl -sL "$TARGET_DIR")

          IB_FILE=$(echo "$HTML_CONTENT" | grep -oE '(immortalwrt|openwrt)-imagebuilder-[^"]+\.tar\.(zst|xz|gz|bz2)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::无法在 ${TARGET_DIR} 找到 ImageBuilder！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 下载第三方 Release 资源并进行无损精准架构筛选 (仅保留 ARM64 / all)
      - name: Download & Filter Third-Party Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKGS_DIR="builder/packages"
          mkdir -p "$PKGS_DIR"
          mkdir -p dl_temp
          cd dl_temp

          download_latest_assets() {
            local repo=$1
            echo "==> 正在获取 $repo 的最新 Release 资源..."
            local rel_json=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases/latest")
            local urls=$(echo "$rel_json" | jq -r '.assets[]? | .browser_download_url // empty' | grep -E '\.(apk|zip|tar\.gz)$' || true)

            for url in $urls; do
              echo "正在下载: $url"
              curl -sSL -O "$url"
            done
          }

          # 下载主要仓库的 Release 包
          download_latest_assets "nikkinikki-org/OpenWrt-nikki"
          download_latest_assets "sbwml/luci-app-mosdns"
          download_latest_assets "Openwrt-Passwall/openwrt-passwall2"

          # 解压所有压缩包（zip / tar.gz）
          find . -type f -name "*.zip" -exec unzip -o {} \; >/dev/null 2>&1 || true
          find . -type f -name "*.tar.gz" -exec tar -zxvf {} \; >/dev/null 2>&1 || true

          echo "=========================================="
          echo "=== 开始严格筛选适用于 ARM64 (aarch64/all) 的 APK 包 ==="
          echo "=========================================="

          # 遍历所有解压出的 .apk，严格检查内部声明的真实架构
          find . -type f -name "*.apk" | while read -r apk_file; do
            # 1. 文件名过滤：排除明显的非 ARM64 架构
            if echo "$apk_file" | grep -qiE 'x86_64|i386|i686|ramips|mipsel|mips|arm_fa526|arm_cortex|armv7|armv6|riscv64|loongarch'; then
              echo "[排除 - 异构文件名]: $apk_file"
              continue
            fi

            # 2. 读取 APK 包内 control.tar.gz/.PKGINFO 中声明的 pkgarch/arch
            PKG_ARCH=""
            if tar -tf "$apk_file" 2>/dev/null | grep -q "control.tar.gz"; then
              PKG_ARCH=$(tar -xzOf "$apk_file" control.tar.gz 2>/dev/null | tar -xzOf - .PKGINFO 2>/dev/null | grep -E '^(arch|pkgarch) =' | head -n1 | cut -d'=' -f2 | tr -d ' ')
            fi

            # 3. 架构校验与复制（仅保留目标架构，且不改变文件内容）
            if [ -n "$PKG_ARCH" ]; then
              case "$PKG_ARCH" in
                aarch64*|arm64*|all|noarch)
                  echo "[保留 - 匹配架构 $PKG_ARCH]: $apk_file"
                  cp -f "$apk_file" "../$PKGS_DIR/"
                  ;;
                *)
                  echo "[排除 - 不兼容架构 $PKG_ARCH]: $apk_file"
                  ;;
              esac
            else
              # 无法解析 .PKGINFO 时的二次兜底判断
              if echo "$apk_file" | grep -qiE 'aarch64|arm64|all'; then
                echo "[保留 - 文件名标记]: $apk_file"
                cp -f "$apk_file" "../$PKGS_DIR/"
              else
                echo "[排除 - 无法确认架构]: $apk_file"
              fi
            fi
          done

          cd ..
          rm -rf dl_temp

      # 5. 配置 ImageBuilder 兼容架构列表
      - name: Configure APK Architectures & Verify Packages
        run: |
          # 显式告知 ImageBuilder 的 apk 包管理器允许安装的主机与通用架构
          mkdir -p builder/etc/apk
          cat << 'EOF' > builder/etc/apk/arch
          aarch64_generic
          aarch64_cortex-a53
          aarch64_cortex-a72
          aarch64
          all
          EOF

          echo "=========================================="
          echo "已成功放入 ImageBuilder 仓库的第三方 APK 列表："
          ls -lh builder/packages/*.apk || echo "警告：未找到任何 APK 文件！"
          echo "=========================================="

      # 6. 生成基础配置文件 (系统时区与 KMS 默认配置)
      - name: Inject Custom UCI Default Settings
        run: |
          FILES_DIR="builder/files/etc/uci-defaults"
          mkdir -p "$FILES_DIR"

          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh

          # 1. 配置系统语言与时区
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci commit system

          # 2. 默认开启 VLMCSD (KMS)
          if [ -f /etc/config/vlmcsd ]; then
            uci set vlmcsd.config.enabled='1'
            uci commit vlmcsd
          fi

          # 3. 确保各个服务开机自启
          for svc in vlmcsd nikki mosdns passwall2; do
            [ -f "/etc/init.d/$svc" ] && /etc/init.d/$svc enable
          done

          exit 0
          EOF

          chmod +x "$FILES_DIR/99-custom-init.sh"

      # 7. 提取软件版本信息
      - name: Collect Software Versions
        run: |
          KERNEL_VER=$(grep -i "LINUX_VERSION" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ' || echo "25.12 Standard Kernel")

          GET_VER() {
            local pattern=$1
            local file=$(ls builder/packages/${pattern}*.apk 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              basename "$file" | sed -E 's/^[^-_]+[-_]//; s/_aarch64.*\.apk$|_all\.apk$|\.apk$//'
            else
              echo "已打入最新版"
            fi
          }

          NIKKI_VER=$(GET_VER "nikki")
          LUCI_NIKKI_VER=$(GET_VER "luci-app-nikki")
          MOSDNS_VER=$(GET_VER "mosdns")
          PASSWALL2_VER=$(GET_VER "luci-app-passwall2")

          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          cat <<EOF > $GITHUB_WORKSPACE/release_body.md
          ## ImmortalWrt 25.12.1 (ARMSR / armv8) 完整代理集成版

          - **构建日期**: $BUILD_DATE
          - **构建 ID**: ${{ github.run_id }}
          - **架构 / 包管理器**: ARMSR (ARM64) / APK

          ### 📦 核心组件版本清单
          - **Linux Kernel**: \`$KERNEL_VER\`
          - **Nikki Core**: \`$NIKKI_VER\`
          - **LuCI App Nikki**: \`$LUCI_NIKKI_VER\`
          - **MosDNS**: \`$MOSDNS_VER\`
          - **PassWall2**: \`$PASSWALL2_VER\`

          ### 🛠 已编译打入固件的软件列表
          - **科学上网/代理 Suite**: PassWall2、Nikki、MosDNS
          - **网络与系统服务**: SoftEtherVPN、VLMCSD (KMS)、VSFTPD、SFTP-Server
          - **底层依赖**: nftables、kmod-nft-tproxy、kmod-tun、xray-core、sing-box、curl、wget-ssl、yq
          EOF

      # 8. 打包 RootFS 并自动删除多余的重复镜像
      - name: Build RootFS
        run: |
          cd builder

          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            nikki luci-app-nikki \
            mosdns luci-app-mosdns \
            luci-app-passwall2 \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq \
            xray-core sing-box tcping unzip resolveip luci-compat"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

          # 清理 redundant 的 targz-rootfs，只保留最标准的 generic-rootfs
          rm -f bin/targets/armsr/armv8/*targz*.tar.gz

      # 9. 上传仅包含 generic-rootfs.tar.gz 的产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-generic-rootfs-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*generic-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 10. 发布仅包含 generic-rootfs.tar.gz 到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR Generic RootFS (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*generic-rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

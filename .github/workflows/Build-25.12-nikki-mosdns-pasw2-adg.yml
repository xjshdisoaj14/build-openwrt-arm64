name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月 1 日 0:00 触发 (北京时间 08:00)
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      # 3. 提取 ImageBuilder (增强容错与自动判断)
      - name: Download & Extract ImageBuilder
        run: |
          # 优先尝试指定的 25.12.1，若不存在则回退至 snapshots 路径
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$TARGET_DIR")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::目标路径 $TARGET_DIR 返回 HTTP $HTTP_CODE，尝试使用 snapshots 路径..."
            TARGET_DIR="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/"
          fi

          echo "Connecting to target repository: ${TARGET_DIR}"
          HTML_CONTENT=$(curl -sL "$TARGET_DIR")

          # 扩大正则匹配范围（兼容 immortalwrt 与 openwrt 命名，兼容 zst/xz/gz/bz2）
          IB_FILE=$(echo "$HTML_CONTENT" | grep -oE '(immortalwrt|openwrt)-imagebuilder-[^"]+\.tar\.(zst|xz|gz|bz2)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::无法在 ${TARGET_DIR} 找到 ImageBuilder！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (Nikki + MosDNS + PassWall2)
      - name: Download & Integrate Offline Packages
        env:
          # 使用 GITHUB_TOKEN 将 API 速率从 60/hr 提升至 5000/hr 避免限流崩溃
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p builder/packages
          mkdir -p dl_temp
          cd dl_temp

          # 封装通用下载函数（带 GITHUB_TOKEN 鉴权与安全 jq 解析）
          download_latest_assets() {
            local repo=$1
            local pattern=$2
            echo "==> 正在获取 $repo 的最新 Releases..."
            
            local rel_json=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases/latest")
            
            # 使用 .assets[]? 规避 API 异常或 null 时 jq 抛出 exit code 3
            local urls=$(echo "$rel_json" | jq -r '.assets[]? | .browser_download_url // empty' | grep -E "$pattern" || true)
            
            if [ -z "$urls" ]; then
              echo "⚠️ 未找到匹配的下载链接，API 响应消息："
              echo "$rel_json" | jq -r '.message // "无错误消息"'
              return 0
            fi

            for url in $urls; do
              echo "正在下载: $url"
              curl -sSL -O "$url"
            done
          }

          # 1) Nikki
          download_latest_assets "nikkinikki-org/OpenWrt-nikki" '(aarch64|arm64|all|\.apk|\.ipk)'

          # 2) MosDNS
          download_latest_assets "sbwml/luci-app-mosdns" '(aarch64|arm64|all|\.apk|\.ipk)'

          # 解压并整理离线包
          find . -name "*.zip" -exec unzip -o {} \;
          find . -name "*.tar.gz" -exec tar -zxvf {} \;
          find . -type f \( -name "*.apk" -o -name "*.ipk" \) -exec mv {} ../builder/packages/ \;

          echo "当前集成至 ImageBuilder 本地库的离线 APK 清单："
          ls -l ../builder/packages/*.apk || echo "未找到 APK 文件！"

          # 3) 独立下载 PassWall2 以避开 ImageBuilder 的签名校验坑
          # 我们将其放入 files/root/passwall2 目录下，稍后通过 init 脚本配合 --allow-untrusted 安装
          echo "==> 正在获取 PassWall2 (Openwrt-Passwall/openwrt-passwall2)..."
          mkdir -p ../builder/files/root/passwall2
          
          PW2_JSON=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest")
          PW2_URLS=$(echo "$PW2_JSON" | jq -r '.assets[]? | .browser_download_url // empty' | grep -E 'luci-(app|i18n)-passwall2.*\.apk' || true)
          
          if [ -z "$PW2_URLS" ]; then
            echo "⚠️ 未找到 PassWall2 包或触发限流，API 响应消息："
            echo "$PW2_JSON" | jq -r '.message // "无错误消息"'
          else
            for url in $PW2_URLS; do
              echo "正在下载 PassWall2: $url"
              curl -sSL -o "../builder/files/root/passwall2/$(basename "$url")" "$url"
            done
          fi
          cd ..

      # 5. 生成自定义系统配置 (注入 apk add --allow-untrusted 核心逻辑)
      - name: Inject Custom Configuration
        run: |
          FILES_DIR="builder/files/etc/uci-defaults"
          mkdir -p "$FILES_DIR"

          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh

          # 1. 配置语言与时区
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci commit system

          # 2. 启用 vlmcsd (KMS 服务)
          if [ -f /etc/config/vlmcsd ]; then
            uci set vlmcsd.config.enabled='1'
            uci commit vlmcsd
          fi

          # 3. 严格遵守原则：使用 --allow-untrusted 安装未签名的第三方 PassWall2 源包
          # (相关依赖已经在下方的 PACKAGES 中提前打入固件，这里只安装由于签名被拒的核心包)
          if ls /root/passwall2/*.apk >/dev/null 2>&1; then
            echo "正在离线安装 PassWall2..." > /dev/console
            apk add --allow-untrusted /root/passwall2/*.apk
            rm -rf /root/passwall2
          fi

          # 4. 启用服务自启（软链接方式兜底）
          [ -f /etc/init.d/vlmcsd ] && /etc/init.d/vlmcsd enable
          [ -f /etc/init.d/nikki ] && /etc/init.d/nikki enable
          [ -f /etc/init.d/mosdns ] && /etc/init.d/mosdns enable
          [ -f /etc/init.d/passwall2 ] && /etc/init.d/passwall2 enable

          exit 0
          EOF

          chmod +x "$FILES_DIR/99-custom-init.sh"

      # 6. 提取主要组件与内核版本号
      - name: Collect Software Versions
        run: |
          # 1. 提取内核版本号
          KERNEL_VER=$(grep -i "LINUX_VERSION" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ' || echo "25.12 Standard Kernel")

          # 2. 提取离线包版本号
          GET_VER() {
            local dir=$1
            local pattern=$2
            local file=$(ls ${dir}/${pattern}*.apk 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              basename "$file" | sed -E 's/^[^-_]+[-_]//; s/_aarch64\.apk$|_all\.apk$|\.apk$//'
            else
              echo "最新发布版"
            fi
          }

          NIKKI_VER=$(GET_VER "builder/packages" "nikki")
          LUCI_NIKKI_VER=$(GET_VER "builder/packages" "luci-app-nikki")
          MOSDNS_VER=$(GET_VER "builder/packages" "mosdns")
          
          # 提取预置在 root 的 PassWall2 版本号
          PASSWALL2_VER=$(GET_VER "builder/files/root/passwall2" "luci-app-passwall2")

          # 3. 获取北京时间 (UTC+8)
          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')

          # 4. 写入环境变量
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          # 写入 Release Body 说明文件
          cat <<EOF > $GITHUB_WORKSPACE/release_body.md
          ## ImmortalWrt 25.12.1 (ARMSR / armv8) 优化版构建

          - **构建日期**: $BUILD_DATE
          - **构建 ID**: ${{ github.run_id }}
          - **架构 / 包管理器**: ARMSR (ARM64) / APK

          ### 📦 核心组件版本清单
          - **Linux Kernel**: \`$KERNEL_VER\`
          - **Nikki Core**: \`$NIKKI_VER\`
          - **LuCI App Nikki**: \`$LUCI_NIKKI_VER\`
          - **MosDNS**: \`$MOSDNS_VER\`
          - **PassWall2**: \`$PASSWALL2_VER\`

          ### 🛠 集成软件列表
          - **代理与 DNS**: PassWall2, Nikki, MosDNS
          - **VPN/网络服务**: SoftEtherVPN、VLMCSD (KMS)、VSFTPD、SFTP-Server
          - **网络增强工具**: nftables、kmod-nft-tproxy、kmod-tun、curl、wget-ssl、yq
          EOF

      # 7. 打包 RootFS
      - name: Build RootFS
        run: |
          cd builder

          # 包含预置 custom files (其中含有 uci-defaults 初始化脚本与预置在系统的 PassWall2 apk)
          # 注意：为了防止 PW2 因缺少依赖安装失败，依赖核心(xray-core、sing-box、luci-compat)预先注入底层固件
          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            nikki luci-app-nikki luci-i18n-nikki-zh-cn \
            mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq \
            xray-core sing-box tcping unzip resolveip luci-compat"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs-optimize-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布编译产物到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS Optimize (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月 1 日 0:00 触发 (北京时间 08:00)
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      # 3. 提取 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$TARGET_DIR")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::目标路径 $TARGET_DIR 返回 HTTP $HTTP_CODE，尝试使用 snapshots 路径..."
            TARGET_DIR="https://downloads.immortalwrt.org/snapshots/targets/armsr/armv8/"
          fi

          echo "Connecting to target repository: ${TARGET_DIR}"
          HTML_CONTENT=$(curl -sL "$TARGET_DIR")

          IB_FILE=$(echo "$HTML_CONTENT" | grep -oE '(immortalwrt|openwrt)-imagebuilder-[^"]+\.tar\.(zst|xz|gz|bz2)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::无法在 ${TARGET_DIR} 找到 ImageBuilder！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (Nikki + MosDNS + PassWall2 统一放入 offline_pkgs 避坑)
      - name: Download & Integrate Offline Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OFFLINE_DIR="builder/files/root/offline_pkgs"
          mkdir -p "$OFFLINE_DIR"
          mkdir -p dl_temp
          cd dl_temp

          download_latest_apk() {
            local repo=$1
            echo "==> 正在获取 $repo 的最新 Release 包..."
            local rel_json=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases/latest")
            
            # 过滤出适合 aarch64_generic / all 的包，剔除 Specific CPU 微架构 (如 cortex-a72, rk3399 等)
            local urls=$(echo "$rel_json" | jq -r '.assets[]? | .browser_download_url // empty' | grep -E '\.(apk|zip|tar\.gz)$' | grep -vE '(cortex|rk3|x86_64|ramips|mipsel)' || true)
            
            if [ -z "$urls" ]; then
              urls=$(echo "$rel_json" | jq -r '.assets[]? | .browser_download_url // empty' | grep -E '\.(apk|zip|tar\.gz)$' || true)
            fi

            for url in $urls; do
              echo "正在下载: $url"
              curl -sSL -O "$url"
            done
          }

          # 1) Nikki
          download_latest_apk "nikkinikki-org/OpenWrt-nikki"

          # 2) MosDNS
          download_latest_apk "sbwml/luci-app-mosdns"

          # 3) PassWall2
          download_latest_apk "Openwrt-Passwall/openwrt-passwall2"

          # 解压压缩包
          find . -name "*.zip" -exec unzip -o {} \;
          find . -name "*.tar.gz" -exec tar -zxvf {} \;

          # 移动 APK 到离线安装目录，并过滤不匹配的 CPU 架构包
          find . -type f -name "*.apk" | while read -r apk_file; do
            if echo "$apk_file" | grep -qE 'cortex-a72|cortex-a53|x86_64|ramips'; then
              echo "跳过不兼容的微架构包: $apk_file"
              continue
            fi
            mv "$apk_file" "../$OFFLINE_DIR/"
          done

          cd ..
          rm -rf dl_temp

          echo "=========================================="
          echo "预置到 /root/offline_pkgs 的第三方离线包清单："
          ls -lh "$OFFLINE_DIR"/*.apk || echo "未找到任何 APK 文件！"
          echo "=========================================="

      # 5. 生成自定义系统配置 (注入 apk add --allow-untrusted 批量安装逻辑)
      - name: Inject Custom Configuration
        run: |
          FILES_DIR="builder/files/etc/uci-defaults"
          mkdir -p "$FILES_DIR"

          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh

          # 1. 配置语言与时区
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci commit system

          # 2. 启用 vlmcsd (KMS 服务)
          if [ -f /etc/config/vlmcsd ]; then
            uci set vlmcsd.config.enabled='1'
            uci commit vlmcsd
          fi

          # 3. 首次开机离线安装第三方包 (跳过签名验证，解决架构与签名限制)
          if ls /root/offline_pkgs/*.apk >/dev/null 2>&1; then
            echo "正在离线安装第三方软件包 (Nikki / MosDNS / PassWall2)..." > /dev/console
            apk add --allow-untrusted /root/offline_pkgs/*.apk
            rm -rf /root/offline_pkgs
          fi

          # 4. 启用服务自启（软链接方式兜底）
          [ -f /etc/init.d/vlmcsd ] && /etc/init.d/vlmcsd enable
          [ -f /etc/init.d/nikki ] && /etc/init.d/nikki enable
          [ -f /etc/init.d/mosdns ] && /etc/init.d/mosdns enable
          [ -f /etc/init.d/passwall2 ] && /etc/init.d/passwall2 enable

          exit 0
          EOF

          chmod +x "$FILES_DIR/99-custom-init.sh"

      # 6. 提取主要组件与内核版本号
      - name: Collect Software Versions
        run: |
          # 1. 提取内核版本号
          KERNEL_VER=$(grep -i "LINUX_VERSION" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ' || echo "25.12 Standard Kernel")

          # 2. 提取离线包版本号
          GET_VER() {
            local pattern=$1
            local file=$(ls builder/files/root/offline_pkgs/${pattern}*.apk 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              basename "$file" | sed -E 's/^[^-_]+[-_]//; s/_aarch64.*\.apk$|_all\.apk$|\.apk$//'
            else
              echo "最新发布版"
            fi
          }

          NIKKI_VER=$(GET_VER "nikki")
          LUCI_NIKKI_VER=$(GET_VER "luci-app-nikki")
          MOSDNS_VER=$(GET_VER "mosdns")
          PASSWALL2_VER=$(GET_VER "luci-app-passwall2")

          # 3. 获取北京时间 (UTC+8)
          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')

          # 4. 写入环境变量
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          # 写入 Release Body 说明文件
          cat <<EOF > $GITHUB_WORKSPACE/release_body.md
          ## ImmortalWrt 25.12.1 (ARMSR / armv8) 优化版构建

          - **构建日期**: $BUILD_DATE
          - **构建 ID**: ${{ github.run_id }}
          - **架构 / 包管理器**: ARMSR (ARM64) / APK

          ### 📦 核心组件版本清单
          - **Linux Kernel**: \`$KERNEL_VER\`
          - **Nikki Core**: \`$NIKKI_VER\`
          - **LuCI App Nikki**: \`$LUCI_NIKKI_VER\`
          - **MosDNS**: \`$MOSDNS_VER\`
          - **PassWall2**: \`$PASSWALL2_VER\`

          ### 🛠 集成软件列表
          - **代理与 DNS**: PassWall2, Nikki, MosDNS
          - **VPN/网络服务**: SoftEtherVPN、VLMCSD (KMS)、VSFTPD、SFTP-Server
          - **网络增强工具**: nftables、kmod-nft-tproxy、kmod-tun、curl、wget-ssl、yq
          EOF

      # 7. 打包 RootFS
      - name: Build RootFS
        run: |
          cd builder

          # 打包系统核心与所有代理组件所需的运行依赖库
          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq \
            xray-core sing-box tcping unzip resolveip luci-compat"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs-optimize-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布编译产物到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS Optimize (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

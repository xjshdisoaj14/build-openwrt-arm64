name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月 1 日 0:00 触发 (北京时间 08:00)
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      # 3. 提取 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (严格限定 PassWall 2)
      - name: Download & Integrate Offline Packages
        run: |
          mkdir -p builder/packages
          cd builder/packages

          # 通用离线包下载函数
          download_assets() {
            local repo=$1
            local pattern=$2
            echo "==> 正在获取 $repo 的最新 Release 资产 (匹配模式: ${pattern:-全部})..."
            local rel_json=$(curl -sL "https://api.github.com/repos/$repo/releases/latest")
            local urls=$(echo "$rel_json" | jq -r '.assets[].browser_download_url // empty')
            
            if [ -z "$urls" ]; then
              echo "警告: 未在 $repo 找到有效下载 URL"
              return 1
            fi

            for url in $urls; do
              if [ -n "$pattern" ]; then
                if echo "$url" | grep -E -i "$pattern"; then
                  echo "正在下载匹配包: $url"
                  curl -sSL -O "$url" || true
                fi
              else
                if echo "$url" | grep -E -i '\.(apk|ipk|zip|tar\.gz)$'; then
                  echo "正在下载: $url"
                  curl -sSL -O "$url" || true
                fi
              fi
            done
          }

          # 1) Nikki
          download_assets "nikkinikki-org/OpenWrt-nikki"

          # 2) MosDNS
          download_assets "sbwml/luci-app-mosdns"

          # 3) PassWall 2 专用匹配 (严格限制只能下载包含 passwall2 命名的 apk/zip)
          echo "==> 检索 PassWall 2 专属离线包..."
          download_assets "chingu910/openwrt-passwall2" "passwall2" || \
          download_assets "xiaorouji/openwrt-passwall2" "passwall2" || true

          # 4) AdGuardHome (LuCI App)
          download_assets "asv1st/luci-app-adguardhome" || download_assets "lsong2020/luci-app-adguardhome" || true

          # 解压可能下载到的 zip / tar.gz 归档包
          for archive in *.zip *.tar.gz; do
            [ -e "$archive" ] || continue
            if [[ "$archive" == *.zip ]]; then
              unzip -o "$archive" || true
            elif [[ "$archive" == *.tar.gz ]]; then
              tar -zxvf "$archive" || true
            fi
            rm -f "$archive"
          done

          # 将解压后处在子目录中的所有 .apk 文件提升到 packages 根目录
          find . -mindepth 2 -name "*.apk" -exec mv {} . \;

          # 强制清理误刷入的 PassWall 1 代包 (如有)
          rm -f *passwall_*.apk 2>/dev/null || true

          # 打印当前成功抓取到的 APK 列表
          echo "=========================================="
          echo "当前成功集成至 ImageBuilder 本地库的离线 APK 清单："
          ls -la *.apk || echo "::warning::未找到任何 APK 文件！"
          echo "=========================================="

          # 校验 PassWall 2 是否成功落盘
          if ! ls luci-app-passwall2*.apk >/dev/null 2>&1 && ! ls *passwall2*.apk >/dev/null 2>&1; then
            echo "::error::未检测到 PassWall 2 (luci-app-passwall2) 的 APK 文件！请检查源中是否有对应 25.12 APK 格式产物。"
            exit 1
          fi

      # 5. 生成自定义系统配置
      - name: Inject Custom Configuration
        run: |
          FILES_DIR="builder/files/etc/uci-defaults"
          mkdir -p "$FILES_DIR"

          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh

          export PATH="/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

          if command -v uci >/dev/null 2>&1; then
            uci set system.@system[0].timezone='CST-8'
            uci set system.@system[0].zonename='Asia/Shanghai'
            uci commit system

            if [ -f /etc/config/vlmcsd ]; then
              uci set vlmcsd.config.enabled='1'
              uci commit vlmcsd
            fi
          fi

          exit 0
          EOF

          chmod +x "$FILES_DIR/99-custom-init.sh"

      # 6. 提取主要组件与内核版本号
      - name: Collect Software Versions
        run: |
          KERNEL_VER=$(grep -i "LINUX_VERSION" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ' || echo "25.12 Standard Kernel")

          cd builder/packages
          GET_VER() {
            local pattern=$1
            local file=$(ls ${pattern}*.apk 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              echo "$file" | sed -E 's/^[^-_]+[-_]//; s/_aarch64\.apk$|_all\.apk$|\.apk$//'
            else
              echo "未知"
            fi
          }

          NIKKI_VER=$(GET_VER "nikki")
          LUCI_NIKKI_VER=$(GET_VER "luci-app-nikki")
          MOSDNS_VER=$(GET_VER "mosdns")
          PASSWALL2_VER=$(GET_VER "luci-app-passwall2")
          ADG_VER=$(GET_VER "luci-app-adguardhome")

          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          cat <<EOF > $GITHUB_WORKSPACE/release_body.md
          ## ImmortalWrt 25.12.1 (ARMSR / armv8) 优化版构建

          - **构建日期**: $BUILD_DATE
          - **构建 ID**: ${{ github.run_id }}
          - **架构 / 包管理器**: ARMSR (ARM64) / APK

          ### 📦 核心组件版本清单
          - **Linux Kernel**: \`$KERNEL_VER\`
          - **Nikki Core**: \`$NIKKI_VER\`
          - **LuCI App Nikki**: \`$LUCI_NIKKI_VER\`
          - **MosDNS**: \`$MOSDNS_VER\`
          - **PassWall 2**: \`$PASSWALL2_VER\`
          - **AdGuard Home**: \`$ADG_VER\`

          ### 🛠 集成软件列表
          - **代理与 DNS**: Nikki (内置 Mihomo 核心)、MosDNS、PassWall 2 (luci-app-passwall2)、AdGuard Home
          - **VPN/网络服务**: SoftEtherVPN、VLMCSD (KMS)、VSFTPD、SFTP-Server
          - **网络增强工具**: nftables、kmod-nft-tproxy、kmod-nft-socket、kmod-nft-nat、kmod-tun、curl、wget-ssl、yq
          EOF

      # 7. 打包 RootFS
      - name: Build RootFS
        run: |
          cd builder

          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            nikki luci-app-nikki luci-i18n-nikki-zh-cn \
            mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn \
            luci-app-passwall2 \
            adguardhome luci-app-adguardhome \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs-optimize-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布编译产物到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS Optimize (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

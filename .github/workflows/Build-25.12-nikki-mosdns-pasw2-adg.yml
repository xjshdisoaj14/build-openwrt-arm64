name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      - name: Download & Integrate Offline Packages (Nikki + MosDNS)
        run: |
          mkdir -p builder/packages
          cd builder/packages

          download_latest_assets() {
            local repo=$1
            echo "==> 正在获取 $repo 的最新 Releases..."
            local rel_json=$(curl -sL "https://api.github.com/repos/$repo/releases/latest")
            local urls=$(echo "$rel_json" | jq -r '.assets[].browser_download_url // empty' | grep -E '(aarch64|arm64|all|\.apk|\.ipk)' || true)
            for url in $urls; do
              echo "正在下载: $url"
              curl -sSL -O "$url"
            done
          }

          download_latest_assets "nikkinikki-org/OpenWrt-nikki"
          download_latest_assets "sbwml/luci-app-mosdns"

          for archive in *.zip *.tar.gz; do
            [ -e "$archive" ] || continue
            if [[ "$archive" == *.zip ]]; then unzip -o "$archive" || true
            elif [[ "$archive" == *.tar.gz ]]; then tar -zxvf "$archive" || true
            fi
            rm -f "$archive"
          done

          find . -mindepth 2 -name "*.apk" -exec mv {} . \;
          echo "当前集成至 ImageBuilder 本地库的离线 APK 清单："
          ls -la *.apk || echo "未找到 APK 文件！"

      - name: Download & Integrate PassWall2
        run: |
          cd builder/packages
          PW2_VER="25.12.25-1"
          PW2_BASE="https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/${PW2_VER}"

          echo "==> 正在下载 PassWall2 ${PW2_VER}..."
          curl -sSL -O "${PW2_BASE}/luci-app-passwall2-${PW2_VER}-r1.apk"
          curl -sSL -O "${PW2_BASE}/luci-i18n-passwall2-zh-cn-25.12.25.apk"
          curl -sSL -O "${PW2_BASE}/passwall_packages_apk_aarch64_generic.zip"

          unzip -o passwall_packages_apk_aarch64_generic.zip -d passwall_pkgs/ || true
          rm -f passwall_packages_apk_aarch64_generic.zip
          find passwall_pkgs -mindepth 1 -name "*.apk" -exec mv {} . \;
          rmdir passwall_pkgs 2>/dev/null || true

          echo "==> PassWall2 集成后 APK 清单："
          ls -la *.apk

      - name: Inject Custom Configuration
        run: |
          FILES_DIR="builder/files/etc/uci-defaults"
          mkdir -p "$FILES_DIR"
          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci commit system

          if [ -f /etc/config/vlmcsd ]; then
            uci set vlmcsd.config.enabled='1'
            uci commit vlmcsd
          fi

          [ -f /etc/init.d/vlmcsd ] && /etc/init.d/vlmcsd enable
          [ -f /etc/init.d/nikki ] && /etc/init.d/nikki enable
          [ -f /etc/init.d/mosdns ] && /etc/init.d/mosdns enable
          [ -f /etc/init.d/passwall2 ] && /etc/init.d/passwall2 enable
          exit 0
          EOF
          chmod +x "$FILES_DIR/99-custom-init.sh"

      - name: Collect Software Versions
        run: |
          KERNEL_VER=$(grep -i "LINUX_VERSION" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ' || echo "25.12 Standard Kernel")

          cd builder/packages
          GET_VER() {
            local pattern=$1
            local file=$(ls ${pattern}*.apk 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              echo "$file" | sed -E 's/^[^-_]+[-_]//; s/_aarch64\.apk$|_all\.apk$|\.apk$//'
            else
              echo "最新发布版"
            fi
          }

          NIKKI_VER=$(GET_VER "nikki")
          LUCI_NIKKI_VER=$(GET_VER "luci-app-nikki")
          MOSDNS_VER=$(GET_VER "mosdns")
          PASSWALL2_VER=$(GET_VER "luci-app-passwall2")

          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          # 用 printf 生成 release_body.md，避免 heredoc 缩进问题
          printf "## ImmortalWrt 25.12.1 (ARMSR / armv8) 优化版构建\n\n" > $GITHUB_WORKSPACE/release_body.md
          printf -- "- **构建日期**: %s\n" "$BUILD_DATE" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **构建 ID**: %s\n" "${{ github.run_id }}" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **架构 / 包管理器**: ARMSR (ARM64) / APK\n\n" >> $GITHUB_WORKSPACE/release_body.md
          printf "### 📦 核心组件版本清单\n" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **Linux Kernel**: \`%s\`\n" "$KERNEL_VER" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **Nikki Core**: \`%s\`\n" "$NIKKI_VER" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **LuCI App Nikki**: \`%s\`\n" "$LUCI_NIKKI_VER" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **MosDNS**: \`%s\`\n" "$MOSDNS_VER" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **PassWall2**: \`%s\`\n\n" "$PASSWALL2_VER" >> $GITHUB_WORKSPACE/release_body.md
          printf "### 🛠 集成软件列表\n" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **代理与 DNS**: Nikki (内置 Mihomo 核心)、PassWall2、MosDNS\n" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **VPN/网络服务**: SoftEtherVPN、VLMCSD (KMS)、VSFTPD、SFTP-Server\n" >> $GITHUB_WORKSPACE/release_body.md
          printf -- "- **网络增强工具**: nftables、kmod-nft-tproxy、kmod-tun、curl、wget-ssl、yq\n" >> $GITHUB_WORKSPACE/release_body.md

      - name: Build RootFS
        run: |
          cd builder
          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            nikki luci-app-nikki luci-i18n-nikki-zh-cn \
            mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq \
            luci-app-passwall2 luci-i18n-passwall2-zh-cn passwall2-core v2ray-plugin xray-core sing-box"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs-optimize-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 关键改动：用 gh CLI 发布 Release，不再依赖任何第三方 Action
      - name: Upload RootFS to GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}"
          ASSETS=$(ls builder/bin/targets/armsr/armv8/*rootfs.tar.gz 2>/dev/null)

          echo "Creating/Updating release $TAG..."
          gh release create "$TAG" \
            --title "ImmortalWrt 25.12.1 ARMSR RootFS Optimize (${{ env.BUILD_DATE }})" \
            --notes-file release_body.md \
            $ASSETS || \
          gh release upload "$TAG" $ASSETS --clobber

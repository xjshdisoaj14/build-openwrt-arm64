name: Build ImmortalWrt 25.12.1 for OECT (OneCloud)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OECT Custom Firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链（纯净版 Ubuntu 标准依赖，不含不存在的 apk 包）
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd \
            gawk qemu-utils dosfstools mtools jq unzip openssl libc6:i386 libstdc++6:i386

      # 3. 下载并解压 OECT 专属 ImageBuilder (meson/s80x)
      - name: Download & Extract ImageBuilder for OECT
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/meson/s80x/"
          echo "Connecting to OECT target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 meson/s80x 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading OECT ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 下载第三方包并建立免签本地源
      - name: Download & Integrate Offline Packages
        run: |
          set -e
          mkdir -p builder/packages
          mkdir -p builder/files/etc/apk

          cd builder

          # 资产获取通用函数
          download_assets() {
            local repo="$1"
            local pattern="${2:-}"
            echo "==> 正在获取 $repo 的 Release 资产..."
            local api="https://api.github.com/repos/$repo/releases"
            local rel_json
            rel_json=$(curl -sL "$api/latest")
            
            if [ -z "$rel_json" ] || echo "$rel_json" | grep -q "404"; then
              rel_json=$(curl -sL "$api" | jq '[.[] | select(.prerelease==false)][0] // .[0]')
            fi
            
            local urls
            urls=$(echo "$rel_json" | jq -r '.assets[].browser_download_url // empty')

            [ -z "$urls" ] && { echo "    ⚠️ 未获取到任何资产"; return 0; }

            echo "$urls" | while read -r url; do
              [ -z "$url" ] && continue
              local name; name=$(basename "$url")
              if echo "$name" | grep -E -q -i '\.(apk|ipk|zip|tar\.gz|tgz)$'; then
                if [ -n "$pattern" ]; then
                  if echo "$name" | grep -E -q -i "$pattern"; then
                    echo "    下载(命中pattern): $name"
                    curl -sSL -O "$url" || true
                  fi
                else
                  echo "    下载(全量): $name"
                  curl -sSL -O "$url" || true
                fi
              fi
            done
          }

          cd packages

          # 下载离线应用包
          download_assets "nikkinikki-org/OpenWrt-Nikki" "nikki"
          download_assets "sbwml/luci-app-mosdns" "mosdns|luci"
          download_assets "Openwrt-Passwall/openwrt-passwall2" "passwall2" || true
          download_assets "asv1st/luci-app-adguardhome" "adguardhome|luci" || true

          # 解压压缩包
          for archive in *.zip *.tar.gz *.tgz; do
            [ -e "$archive" ] || continue
            if [[ "$archive" == *.zip ]]; then
              unzip -o "$archive" || true
            else
              tar -xzf "$archive" || true
            fi
            rm -f "$archive"
          done

          # 扁平化存放
          find . -mindepth 2 -type f \( -name "*.apk" -o -name "*.ipk" \) -exec mv -n {} . \; 2>/dev/null || true

          # 剔除非 ARM32 包（玩客云为 ARMv7 / 32位 架构）
          for pkg_file in *.apk *.ipk; do
            [ -f "$pkg_file" ] || continue
            case "$pkg_file" in
              *_x86_64_*|*_i386_*|*_aarch64_*|*_mips_*)
                echo "    ❌ 剔除非 ARM32 包: $pkg_file"
                rm -f "$pkg_file" ;;
            esac
          done

          cd ..

          # 将本地包路径追加到 repositories.conf，并加上 --allow-untrusted 标识
          LOCAL_REPO_URL="--allow-untrusted file://${PWD}/packages"
          echo "$LOCAL_REPO_URL" >> repositories.conf

          # 使用 ImageBuilder 内部命令生成索引
          make package_index || true

          # 配置 RootFS 内置 apk 允许未签名安装
          printf 'allow_untrusted = true\n' > files/etc/apk/apk.conf

      # 5. 构建玩客云 (OECT) 固件
      - name: Build OECT Image
        run: |
          cd builder

          # 环境变量透传免签选项
          export APK="apk --allow-untrusted"
          export APK_ARGS="--allow-untrusted"
          export EXTRA_APK_ARGS="--allow-untrusted"

          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            nikki luci-app-nikki luci-i18n-nikki-zh-cn \
            mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn \
            luci-app-passwall2 luci-i18n-passwall2-zh-cn \
            adguardhome luci-app-adguardhome \
            luci-app-acme luci-i18n-acme-zh-cn openssl-util \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun"

          PROFILE_NAME=$(make info | grep -oE 'xunlei_onecloud|onecloud' | head -n 1)
          if [ -z "$PROFILE_NAME" ]; then
            PROFILE_NAME="xunlei_onecloud"
          fi
          echo "Selected Profile: $PROFILE_NAME"

          make image PROFILE="$PROFILE_NAME" \
            PACKAGES="$PACKAGES" \
            FILES="files" \
            APK_ARGS="--allow-untrusted" \
            EXTRA_APK_ARGS="--allow-untrusted" \
            -j$(nproc)

      # 6. 上传产物
      - name: Upload OECT Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-oect-onecloud
          path: builder/bin/targets/meson/s80x/*
          if-no-files-found: error
          retention-days: 7

      # 7. 发布 Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: OECT-ImmortalWrt-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 for OECT (OneCloud)
          body: |
            ## OECT (玩客云 OneCloud) 专用固件
            - **Target**: `meson/s80x`
            - **Profile**: `xunlei_onecloud`
          files: builder/bin/targets/meson/s80x/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

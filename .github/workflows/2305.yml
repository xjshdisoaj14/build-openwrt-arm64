name: Build ImmortalWrt 23.05.4 (FW4)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  IMMORTALWRT_VER: "23.05.4"
  ADGUARD_VER: "v0.107.77"

jobs:
  build:
    name: Build ImmortalWrt 23.05.4 RootFS
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并安装标准构建工具
      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar qemu-utils dosfstools mtools git gettext

      # 3. 下载并解压 23.05.4 armvirt/64 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          IB_URL="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VER}/targets/armvirt/64/immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armvirt-64.Linux-x86_64.tar.xz"
          wget -qO- "$IB_URL" | tar -xJ
          mv immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armvirt-64.Linux-x86_64 builder

      # 4. 集成 AdGuard Home ARM64 官方二进制文件
      - name: Integrate AdGuard Home ARM64 Binary
        run: |
          mkdir -p builder/files/usr/bin/AdGuardHome
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/${ADGUARD_VER}/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C /tmp
          mv /tmp/AdGuardHome/AdGuardHome builder/files/usr/bin/AdGuardHome/AdGuardHome
          chmod +x builder/files/usr/bin/AdGuardHome/AdGuardHome
          rm -rf /tmp/AdGuardHome

      # 5. 集成 luci-app-adguardhome 文件资源至 files 目录
      - name: Integrate luci-app-adguardhome Files
        run: |
          git clone --depth=1 https://github.com/rufengsuixing/luci-app-adguardhome.git /tmp/luci-app-adguardhome
          
          mkdir -p builder/files/etc/init.d
          mkdir -p builder/files/etc/config
          mkdir -p builder/files/usr/lib/lua/luci
          mkdir -p builder/files/www
          
          if [ -d /tmp/luci-app-adguardhome/root ]; then
            cp -r /tmp/luci-app-adguardhome/root/* builder/files/
          fi
          if [ -d /tmp/luci-app-adguardhome/luasrc ]; then
            cp -r /tmp/luci-app-adguardhome/luasrc/* builder/files/usr/lib/lua/luci/
          fi
          if [ -d /tmp/luci-app-adguardhome/htdocs ]; then
            cp -r /tmp/luci-app-adguardhome/htdocs/* builder/files/www/
          fi

          chmod +x builder/files/etc/init.d/* 2>/dev/null || true

      # 6. 预设 AdGuard Home UCI 默认配置
      - name: Create Default AdGuard Home UCI Config
        run: |
          mkdir -p builder/files/etc/config
          cat << 'EOF' > builder/files/etc/config/adguardhome
config adguardhome 'config'
    option enabled '1'
    option binpath '/usr/bin/AdGuardHome/AdGuardHome'
    option workpath '/usr/bin/AdGuardHome'
    option redirect_mode 'exchange'
EOF

      # 7. 执行打包（FW4 / nftables 软件栈）
      - name: Build RootFS
        run: |
          cd builder
          
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-i18n-passwall-zh-cn xray-core ipset \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates nftables kmod-nft-tproxy"

          make image PROFILE="" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传 RootFS 归档包
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-23.05.4-armvirt-64-rootfs
          path: builder/bin/targets/armvirt/64/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 30

      # 9. 自动发布到 GitHub Release
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ImmortalWrt 23.05.4 RootFS (${{ github.ref_name }})"
          body: |
            ### 自动化构建完成 (FW4 / 23.05)
            - **固件版本**: ImmortalWrt ${{ env.IMMORTALWRT_VER }}
            - **内核/架构**: armvirt/64
            - **防火墙架构**: FW4 (nftables)
            - **集成组件**: AdGuard Home (${{ env.ADGUARD_VER }}), PassWall, SmartDNS, SoftEtherVPN 等。
          files: builder/bin/targets/armvirt/64/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

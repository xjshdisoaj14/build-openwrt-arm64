name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite + HTTPS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链 (支持 zstd 与 xz)
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq

      # 3. 直连提取 ImageBuilder (25.12.1 / armsr/armv8)
      - name: Download & Extract ImageBuilder (25.12.1 Direct)
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 精准获取并集成第三方离线包 (Nikki + MosDNS + Daed + PassWall2)
      - name: Download & Integrate Offline Packages
        run: |
          mkdir -p builder/packages
          cd builder/packages

          # 1) 精准获取 Nikki (适配 25.12 且仅限 aarch64_generic)
          echo "==> 正在获取 Nikki 的最新 Releases..."
          NIKKI_URL=$(curl -sL "https://api.github.com/repos/nikkinikki-org/OpenWrt-nikki/releases/latest" | jq -r '.assets[].browser_download_url' | grep -E 'aarch64_generic-openwrt-25\.12\.tar\.gz' | head -n 1)
          if [ -n "$NIKKI_URL" ]; then
            echo "正在下载 Nikki: $NIKKI_URL"
            curl -sSL -O "$NIKKI_URL"
          fi

          # 2) 获取 MosDNS (sbwml 维护版本)
          echo "==> 正在获取 MosDNS 的最新 Releases..."
          MOSDNS_URLS=$(curl -sL "https://api.github.com/repos/sbwml/luci-app-mosdns/releases/latest" | jq -r '.assets[].browser_download_url // empty' | grep -E '(\.apk|\.tar\.gz|\.zip)')
          for url in $MOSDNS_URLS; do
            echo "正在下载 MosDNS 组件: $url"
            curl -sSL -O "$url"
          done

          # 3) 获取 Daed (dae UI)
          echo "==> 正在获取 Daed 的最新 Releases..."
          DAED_URLS=$(curl -sL "https://api.github.com/repos/daed-project/daed-openwrt/releases/latest" | jq -r '.assets[].browser_download_url // empty' | grep -E '(aarch64|arm64|all|\.apk)')
          for url in $DAED_URLS; do
            echo "正在下载 Daed 组件: $url"
            curl -sSL -O "$url"
          done

          # 4) 获取 PassWall2
          echo "==> 正在获取 PassWall2 最新 Releases..."
          PW2_URLS=$(curl -sL "https://api.github.com/repos/xiaorouji/openwrt-passwall2/releases/latest" | jq -r '.assets[].browser_download_url // empty' | grep -E '(\.apk|\.zip|\.tar\.gz)')
          for url in $PW2_URLS; do
            echo "正在下载 PassWall2 组件: $url"
            curl -sSL -O "$url"
          done

          # 批量处理解压所有压缩包
          for archive in *.tar.gz *.zip; do
            if [ -f "$archive" ]; then
              echo "正在解压: $archive"
              tar -zxvf "$archive" 2>/dev/null || unzip -o "$archive" 2>/dev/null || true
              rm -f "$archive"
            fi
          done

          # 确保所有子目录下的 .apk 文件全部挪到 packages 根目录
          find . -mindepth 2 -name "*.apk" -exec mv {} . \;

          echo "=========================================="
          echo "当前集成至 ImageBuilder 本地库的离线 APK 清单："
          ls -la *.apk || true
          echo "=========================================="

      # 5. 集成 AdGuard Home 二进制 (ARM64)
      - name: Integrate AdGuard Home Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.77/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 6. 配置 AdGuard Home 服务自启动
      - name: Configure AdGuard Home Service
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF
          chmod +x builder/files/etc/init.d/adguardhome

      # 7. 打包 RootFS
      - name: Build RootFS
        run: |
          cd builder

          # 构建基础包列表
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-app-acme luci-i18n-acme-zh-cn openssl-util px5g-standalone \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq"

          # 容错处理：根据实际解压出的 APK 文件名，动态挂载对应软件包
          if ls packages/*nikki*.apk 1> /dev/null 2>&1; then
            PACKAGES="$PACKAGES nikki luci-app-nikki luci-i18n-nikki-zh-cn"
          fi

          if ls packages/*mosdns*.apk 1> /dev/null 2>&1; then
            PACKAGES="$PACKAGES mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn"
          fi

          if ls packages/*daed*.apk 1> /dev/null 2>&1; then
            PACKAGES="$PACKAGES daed luci-app-daed"
          fi

          if ls packages/*passwall2*.apk 1> /dev/null 2>&1; then
            PACKAGES="$PACKAGES luci-app-passwall2 luci-i18n-passwall2-zh-cn"
          fi

          echo "最终参与打包的 PACKAGES 列表："
          echo "$PACKAGES"

          make image PROFILE="" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布编译产物到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS
          body: |
            ## ImmortalWrt 25.12.1 (ARMSR / armv8) 自动构建
            - **架构 / 包管理器**: ARMSR (ARM64) / APK
            - **内置组件**: 
              - PassWall2 / Nikki / MosDNS / Daed (基于解压成功项集成)
              - AdGuard Home 二进制
              - HTTPS / ACME 自动化证书工具链
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

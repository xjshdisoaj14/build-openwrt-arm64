name: Build ImmortalWrt 21.02.7 (FW3 - Fixed)

on:
  workflow_dispatch:

env:
  IMMORTALWRT_VER: "21.02.7"
  ADGUARD_VER: "v0.107.77"

jobs:
  build:
    name: Build ImmortalWrt 21.02.7 RootFS
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并补全所有构建依赖
      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar qemu-utils dosfstools mtools git gettext

      # 3. 下载并解压 21.02.7 armvirt/64 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          IB_URL="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VER}/targets/armvirt/64/immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armvirt-64.Linux-x86_64.tar.xz"
          wget -qO- "$IB_URL" | tar -xJ
          mv immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armvirt-64.Linux-x86_64 builder

      # 4. 集成 AdGuard Home ARM64 二进制文件
      - name: Integrate AdGuard Home ARM64 Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/${ADGUARD_VER}/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 5. 集成 LuCI UI 界面并配置 UCI 预设（由 LuCI 插件全权接管服务生命周期）
      - name: Integrate LuCI UI for AdGuard Home
        run: |
          git clone --depth=1 https://github.com/rufengsuixing/luci-app-adguardhome.git /tmp/luci-app-adguardhome
          
          # 创建必要的目录结构
          mkdir -p builder/files/usr/lib/lua/luci
          mkdir -p builder/files/www/luci-static/resources/view
          mkdir -p builder/files/usr/share/luci/menu.d
          mkdir -p builder/files/usr/share/rpcd/acl.d
          mkdir -p builder/files/etc/config
          mkdir -p builder/files/etc/uci-defaults

          # 兼容复制 Lua 目录（若存在）
          [ -d /tmp/luci-app-adguardhome/luasrc ] && cp -r /tmp/luci-app-adguardhome/luasrc/* builder/files/usr/lib/lua/luci/ || true
          
          # 兼容复制 JavaScript 目录（若存在）
          [ -d /tmp/luci-app-adguardhome/htdocs/luci-static/resources ] && cp -r /tmp/luci-app-adguardhome/htdocs/luci-static/resources/* builder/files/www/luci-static/resources/ || true
          
          # 复制菜单与 ACL 权限控制文件
          [ -d /tmp/luci-app-adguardhome/root/usr/share/luci/menu.d ] && cp -r /tmp/luci-app-adguardhome/root/usr/share/luci/menu.d/* builder/files/usr/share/luci/menu.d/ || true
          [ -d /tmp/luci-app-adguardhome/root/usr/share/rpcd/acl.d ] && cp -r /tmp/luci-app-adguardhome/root/usr/share/rpcd/acl.d/* builder/files/usr/share/rpcd/acl.d/ || true
          
          # 复制默认配置
          [ -d /tmp/luci-app-adguardhome/root/etc/config ] && cp -r /tmp/luci-app-adguardhome/root/etc/config/* builder/files/etc/config/ || true
          [ -d /tmp/luci-app-adguardhome/root/etc/uci-defaults ] && cp -r /tmp/luci-app-adguardhome/root/etc/uci-defaults/* builder/files/etc/uci-defaults/ || true

          # 预设 UCI 配置文件：开启服务、正确指向路径并开启端口交换重定向
          cat << 'EOF' > builder/files/etc/config/adguardhome
          config adguardhome 'config'
              option enabled '1'
              option binpath '/opt/AdGuardHome/AdGuardHome'
              option workpath '/opt/AdGuardHome'
              option redirect_mode 'exchange'
          EOF

      # 6. 执行打包
      - name: Build RootFS
        run: |
          cd builder
          
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-i18n-passwall-zh-cn xray-core ipset \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates iptables iptables-mod-tproxy"

          make image PROFILE="" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 7. 上传 RootFS 归档包供 Docker 使用
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-21.02.7-armvirt-64-rootfs
          path: builder/bin/targets/armvirt/64/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

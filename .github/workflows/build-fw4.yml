name: Build ImmortalWrt 25.12.1 (FW4 & Nftables Fully Optimized)

on:
  workflow_dispatch:

env:
  IMMORTALWRT_VER: "25.12.1"
  ADGUARD_VER: "v0.107.77"

jobs:
  build:
    name: Build ImmortalWrt 25.12.1 RootFS
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools

      # 3. 动态抓取 ImageBuilder 压缩包（自适应 .xz / .zst 后缀）
      - name: Auto-Fetch & Extract ImageBuilder
        run: |
          BASE_URL="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VER}/targets/armvirt/64/"
          echo "Scanning target directory: ${BASE_URL}"
          
          IB_FILENAME=$(curl -sL "$BASE_URL" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(xz|zst)' | head -n 1)
          
          if [ -z "$IB_FILENAME" ]; then
            IB_FILENAME="immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armvirt-64.Linux-x86_64.tar.xz"
          fi

          FULL_URL="${BASE_URL}${IB_FILENAME}"
          echo "Downloading ImageBuilder from: ${FULL_URL}"

          mkdir -p builder
          curl -fL "$FULL_URL" -o ib_package.archive

          if [[ "$IB_FILENAME" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 集成 AdGuard Home 二进制
      - name: Integrate AdGuard Home Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/${ADGUARD_VER}/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 5. 配置 AdGuard Home 服务自启
      - name: Configure AdGuard Home Service
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF

          chmod +x builder/files/etc/init.d/adguardhome

      # 6. 执行镜像打包（核心：完美解决 nftables 与 Passwall 插件底层冲突及视频断流）
      - name: Build RootFS
        run: |
          cd builder
          
          # 【编译层关键优化说明】
          # 针对高版本纯 nftables (FW4) 架构：
          # 1. 引入 kmod-nft-tproxy 与 kmod-nft-socket：为 Passwall 提供现代内核级的透明代理与套接字重定向支持，彻底解决外网视频（QUIC/UDP）断流、缓冲卡死。
          # 2. 引入 chinadns-ng 与 xray-plugin：补全高并发域名防污染及高级传输协议。
          # 3. 彻底抛弃过时的 iptables 模块，避免内核空间挂钩冲突。
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-i18n-passwall-zh-cn xray-core xray-plugin chinadns-ng \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat"

          make image PROFILE="" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 7. 上传编译产物
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-nftables-rootfs
          path: builder/bin/targets/armvirt/64/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

name: Build ImmortalWrt NextGen (Mihomo FW4 Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链 (确保支持 zstd 和 xz)
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq

      # 3. 动态识别与抓取官方镜像（支持 armsr/armv8 与 armvirt/64 双重回溯，彻底解决 404）
      - name: Auto-Discover & Download ImageBuilder
        run: |
          BASE_URL="https://downloads.immortalwrt.org/releases"

          echo "==> 正在扫描 ImmortalWrt 官方所有 Stable Release 版本..."
          VERSIONS=$(curl -sL "${BASE_URL}/" | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | cut -d'"' -f2 | tr -d '/' | sort -V -r)

          FOUND_URL=""
          SELECTED_VER=""
          ARCH_TYPE=""

          # 依次遍历各版本，优先检测新架构 armsr/armv8，次选旧架构 armvirt/64
          for VER in $VERSIONS; do
            for ARCH in "armsr/armv8" "armvirt/64"; do
              TARGET_DIR="${BASE_URL}/${VER}/targets/${ARCH}"
              echo "检查: Version ${VER} [${ARCH}]..."

              # 抓取包含 imagebuilder 且后缀为 .tar.zst 或 .tar.xz 的真实文件名
              IB_FILE=$(curl -sL "${TARGET_DIR}/" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

              if [ -n "$IB_FILE" ]; then
                DOWNLOAD_URL="${TARGET_DIR}/${IB_FILE}"
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DOWNLOAD_URL")
                if [ "$HTTP_CODE" -eq 200 ]; then
                  FOUND_URL="$DOWNLOAD_URL"
                  SELECTED_VER="$VER"
                  ARCH_TYPE="$ARCH"
                  IB_FILENAME="$IB_FILE"
                  break 2
                fi
              fi
            done
          done

          if [ -z "$FOUND_URL" ]; then
            echo "::error::未能在官方源找到有效的 ImageBuilder 下载包！"
            exit 1
          fi

          echo "=============================================="
          echo "成功找到可用镜像源:"
          echo "版本: ${SELECTED_VER}"
          echo "架构: ${ARCH_TYPE}"
          echo "链接: ${FOUND_URL}"
          echo "=============================================="

          # 下载并解压
          curl -sL "$FOUND_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILENAME" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 集成 AdGuard Home 二进制 (ARM64)
      - name: Integrate AdGuard Home Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.77/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 5. 配置 AdGuard Home 服务自启
      - name: Configure AdGuard Home Service
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF

          chmod +x builder/files/etc/init.d/adguardhome

      # 6. 打包 RootFS（极致安全、隐蔽、快速、轻量的 Mihomo 原生 nftables 组合）
      - name: Build RootFS
        run: |
          cd builder
          
          # 【打包策略与架构优势】
          # 1. 隐蔽与安全：luci-app-mihomo 原生完美支持 Hysteria 2 / VLESS-REALITY / TUIC v5 / ShadowTLS 等抗封锁协议；
          # 2. 快速与轻量：纯 nftables TPROXY 转发（kmod-nft-tproxy + kmod-nft-socket），彻底告别 iptables 兼容层性能损耗；
          # 3. 高效 DNS 防污染：SmartDNS + AdGuardHome 构建高并发解析链；
          # 4. 彻底屏蔽 IPv6 模块，减少网络攻击面与不必要的开销。
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            mihomo luci-app-mihomo luci-i18n-mihomo-zh-cn \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat"

          make image PROFILE="" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 7. 上传编译 RootFS 产物
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mihomo-rootfs
          path: builder/bin/targets/*/*/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

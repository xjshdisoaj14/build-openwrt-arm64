name: Build ImmortalWrt (FW4 - High Stability)

on:
  workflow_dispatch:

env:
  IMMORTALWRT_VER: "23.05.3"
  ADGUARD_VER: "v0.107.77"

jobs:
  build:
    name: Build ImmortalWrt FW4 RootFS
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并安装构建依赖（包含 zstd 工具）
      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar zstd qemu-utils dosfstools mtools

      # 3. 稳健下载并解压 ImageBuilder (精准匹配 23.05.3 的 tar.zst 格式)
      - name: Download & Extract ImageBuilder
        run: |
          IB_URL="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VER}/targets/armvirt/64/immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armvirt-64.Linux-x86_64.tar.zst"
          
          echo "Downloading ImageBuilder from: ${IB_URL}"
          mkdir -p builder
          
          # 使用 curl -fL 确保遇到 404 时立即报错退出，并跟随 HTTP 重定向
          curl -fL "$IB_URL" -o ib_package.tar.zst
          
          # 使用 zstd + tar 进行解压
          tar --zstd -xf ib_package.tar.zst -C builder --strip-components=1
          rm -f ib_package.tar.zst

      # 4. 集成 AdGuard Home ARM64 二进制文件
      - name: Integrate AdGuard Home ARM64 Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/${ADGUARD_VER}/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 5. 配置 AdGuard Home 服务开机自启
      - name: Configure AdGuard Home Service Auto-start
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF

          chmod +x builder/files/etc/init.d/adguardhome

      # 6. 执行打包 (保留 iptables-nft 兼容层，确保 PassWall 在 FW4 上极速稳定运行)
      - name: Build RootFS
        run: |
          cd builder
          
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-i18n-passwall-zh-cn xray-core sing-box \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            iptables-nft ipset kmod-ipt-nat kmod-ipt-tproxy"

          make image PROFILE="" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 7. 上传 RootFS 归档包
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-23.05.3-fw4-stable-rootfs
          path: builder/bin/targets/armvirt/64/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

name: Build ImmortalWrt NextGen (Mihomo FW4 Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链 (支持 xz 和 zstd)
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq

      # 3. 动态获取官方真实存在的最新的 Release 版本与 ImageBuilder URL (彻底杜绝 404)
      - name: Auto-Discover & Download ImageBuilder
        run: |
          # 自动匹配官方 releases 页面中真实存在的最新稳定版
          LATEST_VER=$(curl -sL "https://downloads.immortalwrt.org/releases/" | grep -oE '[0-9]{2}\.[0-9]{2}\.[0-9]+' | sort -V | tail -n 1)
          
          if [ -z "$LATEST_VER" ]; then
            echo "Failed to auto-detect version, using verified fallback release 23.05.4"
            LATEST_VER="23.05.4"
          fi

          echo "Detected Latest ImmortalWrt Version: ${LATEST_VER}"
          BASE_URL="https://downloads.immortalwrt.org/releases/${LATEST_VER}/targets/armvirt/64/"
          
          # 动态匹配 Index 页面中真实存在的文件名 (.tar.xz 或 .tar.zst)
          IB_FILENAME=$(curl -sL "$BASE_URL" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(xz|zst)' | head -n 1)

          if [ -z "$IB_FILENAME" ]; then
            echo "::error::ImageBuilder package not found under ${BASE_URL}"
            exit 1
          fi

          FULL_URL="${BASE_URL}${IB_FILENAME}"
          echo "Downloading ImageBuilder from: ${FULL_URL}"

          mkdir -p builder
          curl -fL "$FULL_URL" -o ib_package.archive

          if [[ "$IB_FILENAME" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 集成 AdGuard Home 二进制 (ARM64)
      - name: Integrate AdGuard Home Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.77/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 5. 配置 AdGuard Home 服务自启
      - name: Configure AdGuard Home Service
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF

          chmod +x builder/files/etc/init.d/adguardhome

      # 6. 打包 RootFS（极致安全、隐蔽、快速、轻量的 Mihomo 生态组合）
      - name: Build RootFS
        run: |
          cd builder
          
          # 【打包策略与架构优势】
          # 1. 安全与隐蔽：luci-app-mihomo + mihomo 核心，完美支持 Hysteria 2 / VLESS-REALITY / TUIC v5 协议；
          # 2. 快速与轻量：纯 nftables TPROXY 转发（kmod-nft-tproxy + kmod-nft-socket），规避 iptables 性能损耗；
          # 3. SmartDNS + AdGuardHome 构建高并发防污染 DNS 链；
          # 4. 精简 IPv6，降低系统开销与攻击面。
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            mihomo luci-app-mihomo luci-i18n-mihomo-zh-cn \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat"

          make image PROFILE="" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 7. 上传编译产物
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mihomo-fw4-rootfs
          path: builder/bin/targets/armvirt/64/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

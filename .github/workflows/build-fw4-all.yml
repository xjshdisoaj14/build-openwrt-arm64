name: Build ImmortalWrt 25.12.1 (ARMSR + Full Proxy Suite + HTTPS/TLS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链 (优化网络与超时控制)
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::ftp::Timeout="10"
          sudo apt-get install -y --no-install-recommends \
            make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      # 3. 直连提取 ImageBuilder (25.12.1 / armsr/armv8)
      - name: Download & Extract ImageBuilder (25.12.1 Direct)
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl --connect-timeout 10 --retry 3 -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl --connect-timeout 15 --retry 3 -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 集成 Nikki (Mihomo UI) 离线安装包 (精细筛选)
      - name: Download & Integrate Nikki Packages
        run: |
          mkdir -p builder/packages
          cd builder/packages

          echo "==> 正在获取 Nikki 最新 Releases..."
          RELEASE_JSON=$(curl --connect-timeout 10 --retry 3 -sL https://api.github.com/repos/nikkinikki-org/OpenWrt-nikki/releases/latest)
          DOWNLOAD_URLS=$(echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url // empty' | grep -E '(aarch64|arm64|all|\.apk)' || true)

          for URL in $DOWNLOAD_URLS; do
            echo "下载 Nikki 组件: $URL"
            curl --connect-timeout 10 --retry 3 -sSL -O "$URL"
          done

          # 解压所有的压缩包
          for TARBALL in *.tar.gz *.zip; do
            if [ -f "$TARBALL" ]; then
              tar -zxvf "$TARBALL" 2>/dev/null || unzip -o "$TARBALL" 2>/dev/null || true
              rm -f "$TARBALL"
            fi
          done

          # 清理非 .apk 文件以及系统重名冲突包
          rm -f *.ipk
          rm -f base-files*.apk kernel*.apk libc*.apk mihomo*.apk

          echo "==> 过滤后的本地有效组件包："
          ls -la *.apk || true

      # 5. 集成 daed 二进制
      - name: Integrate daed Binary
        run: |
          mkdir -p builder/files/usr/bin
          mkdir -p builder/files/etc/daed

          echo "==> 获取 daed 最新 Release 并提取 ARM64 二进制..."
          DAED_JSON=$(curl --connect-timeout 10 --retry 3 -sL https://api.github.com/repos/daeuniverse/daed/releases/latest)
          DAED_URL=$(echo "$DAED_JSON" | jq -r '.assets[].browser_download_url // empty' | grep -iE '(arm64|aarch64)' | grep -iE '\.(tar\.gz|zip|gz)$' | head -n 1 || true)

          if [ -z "$DAED_URL" ]; then
            echo "::warning:: 未在 API 中动态匹配到资源，使用备用 Tag 匹配下载路径..."
            TAG_NAME=$(echo "$DAED_JSON" | jq -r '.tag_name // "v0.8.0"')
            DAED_URL="https://github.com/daeuniverse/daed/releases/download/${TAG_NAME}/daed-linux-arm64.zip"
          fi

          echo "正在下载 daed: $DAED_URL"
          curl --connect-timeout 15 --retry 3 -sSL "$DAED_URL" -o daed_download_file

          mkdir -p daed_tmp
          if unzip -t daed_download_file >/dev/null 2>&1; then
            unzip -o daed_download_file -d daed_tmp/
          elif tar -ztf daed_download_file >/dev/null 2>&1; then
            tar -zxvf daed_download_file -C daed_tmp/
          else
            cp daed_download_file daed_tmp/daed
          fi

          DAED_BIN=$(find daed_tmp/ -type f -name "daed" | head -n 1)
          if [ -n "$DAED_BIN" ]; then
            cp -f "$DAED_BIN" builder/files/usr/bin/daed
            chmod +x builder/files/usr/bin/daed
            echo "daed 二进制集成成功！"
          else
            echo "::error:: 未能成功解析并提取 daed 二进制文件！"
            exit 1
          fi
          rm -rf daed_download_file daed_tmp

      # 6. 集成 AdGuard Home 二进制
      - name: Integrate AdGuard Home Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.77/AdGuardHome_linux_arm64.tar.gz"
          curl --connect-timeout 15 --retry 3 -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 7. 配置后台服务自启动与 SSL/TLS 证书目录
      - name: Configure System Services Init Scripts & SSL
        run: |
          mkdir -p builder/files/etc/init.d
          mkdir -p builder/files/etc/ssl/mycerts

          # 1. 写入 AdGuardHome 服务脚本
          printf '%s\n' \
            '#!/bin/sh /etc/rc.common' \
            '' \
            'START=99' \
            'STOP=10' \
            '' \
            'USE_PROCD=1' \
            'PROCD_DEBUG=1' \
            '' \
            'PROG=/opt/AdGuardHome/AdGuardHome' \
            'WORK_DIR=/opt/AdGuardHome' \
            '' \
            'start_service() {' \
            '    procd_open_instance' \
            '    procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR' \
            '    procd_set_param respawn' \
            '    procd_set_param stdout 1' \
            '    procd_set_param stderr 1' \
            '    procd_close_instance' \
            '}' > builder/files/etc/init.d/adguardhome

          chmod +x builder/files/etc/init.d/adguardhome

          # 2. 写入 daed 服务脚本
          printf '%s\n' \
            '#!/bin/sh /etc/rc.common' \
            '' \
            'START=95' \
            'STOP=15' \
            '' \
            'USE_PROCD=1' \
            'PROG=/usr/bin/daed' \
            '' \
            'start_service() {' \
            '    procd_open_instance' \
            '    procd_set_param command $PROG run -c /etc/daed' \
            '    procd_set_param respawn' \
            '    procd_set_param stdout 1' \
            '    procd_set_param stderr 1' \
            '    procd_close_instance' \
            '}' > builder/files/etc/init.d/daed

          chmod +x builder/files/etc/init.d/daed

      # 8. 打包 RootFS (增加 HTTPS/SSL 软件包)
      - name: Build RootFS
        run: |
          cd builder

          # 动态获取已过滤好的第三方本地 .apk 包
          LOCAL_PACKAGES=""
          if [ -d "packages" ]; then
            for PKG in packages/*.apk; do
              if [ -f "$PKG" ]; then
                LOCAL_PACKAGES="$LOCAL_PACKAGES $PKG"
              fi
            done
          fi

          # 包含了 HTTPS/SSL 支持的完整包列表
          BASE_PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-ssl \
            openssl-util \
            ca-bundle \
            ca-certificates \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            mosdns \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq \
            bpftool kmod-ikconfig"

          ALL_PACKAGES="$BASE_PACKAGES $LOCAL_PACKAGES"

          make image PROFILE="" PACKAGES="$ALL_PACKAGES" FILES="files" -j$(nproc)

      # 9. 上传 RootFS 编译产物
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

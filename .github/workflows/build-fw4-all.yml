name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite + HTTPS)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链并安装 Alpine apk 静态二进制
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq

          # 安装 Alpine apk.static，解决 Ubuntu 无 apt-tools 问题
          mkdir -p /tmp/apk-setup
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/x86_64/apk-tools-static-3.20.0-r0.apk" | tar -xz -C /tmp/apk-setup
          sudo cp /tmp/apk-setup/sbin/apk.static /usr/local/bin/apk
          sudo chmod +x /usr/local/bin/apk
          rm -rf /tmp/apk-setup
          echo "APK Tool 版本:"
          apk --version

      # 3. 直连提取 ImageBuilder (25.12.1 / armsr/armv8)
      - name: Download & Extract ImageBuilder (25.12.1 Direct)
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -fsSL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -fsSL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (Nikki + MosDNS + PassWall 2)
      - name: Download & Integrate Offline Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p builder/packages
          cd builder/packages

          # 带 Token 鉴权的安全下载函数
          download_latest_assets() {
            local repo=$1
            echo "==> 正在获取 $repo 的最新 Releases..."
            local rel_json
            rel_json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases/latest" || true)
            
            if [ -z "$rel_json" ]; then
              echo "::warning::未能成功读取仓库 $repo 的 Release 信息。"
              return 0
            fi

            local urls
            urls=$(echo "$rel_json" | jq -r '.assets[].browser_download_url // empty' | grep -E '(aarch64|arm64|all|\.apk|\.ipk)' || true)
            
            for url in $urls; do
              echo "正在下载: $url"
              curl -fsSL -O "$url" || true
            done
          }

          # 1) Nikki
          download_latest_assets "nikkinikki-org/OpenWrt-nikki"

          # 2) MosDNS
          download_latest_assets "sbwml/luci-app-mosdns"

          # 3) PassWall 2 专用仓库
          download_latest_assets "openwrt-passwall/openwrt-passwall2" || true
          download_latest_assets "xiaorouji/openwrt-passwall2" || true
          download_latest_assets "openwrt-passwall/openwrt-passwall-packages" || true

          # 解压可能包含离线包的 zip/tar.gz
          for archive in *.tar.gz *.zip; do
            if [ -f "$archive" ]; then
              tar -zxvf "$archive" 2>/dev/null || unzip -o "$archive" 2>/dev/null || true
              rm -f "$archive"
            fi
          done

          # 统一归集所有 .apk / .ipk 文件到 builder/packages 根目录
          find . -mindepth 2 \( -name "*.apk" -o -name "*.ipk" \) -exec mv {} . \;

          # 生成本地 APK 索引库 (packages.adb)
          if ls *.apk >/dev/null 2>&1; then
            echo "==> 正在建立本地 APK 索引库..."
            apk index -o packages.adb *.apk 2>/dev/null || true
          fi

          echo "当前已集成的离线包清单："
          ls -la *.apk 2>/dev/null || true

      # 5. 集成 AdGuard Home 二进制 (ARM64) - 增加校验与落地保护
      - name: Integrate AdGuard Home Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p builder/files/opt/AdGuardHome
          
          AGH_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest" || true)
          AGH_URL=$(echo "$AGH_JSON" | jq -r '.assets[].browser_download_url // empty' | grep -E 'AdGuardHome_linux_arm64\.tar\.gz' | head -n 1)

          if [ -z "$AGH_URL" ]; then
            echo "::warning::自动获取最新链接失败，使用备用稳定版 AdGuard Home 链接..."
            AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.56/AdGuardHome_linux_arm64.tar.gz"
          fi

          echo "正在从以下地址下载 AdGuard Home: $AGH_URL"
          curl -fsSL "$AGH_URL" -o /tmp/agh.tar.gz
          
          tar -zxvf /tmp/agh.tar.gz -C /tmp/
          cp -r /tmp/AdGuardHome/* builder/files/opt/AdGuardHome/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome
          rm -rf /tmp/agh.tar.gz /tmp/AdGuardHome

      # 6. 配置 AdGuard Home 服务自启动
      - name: Configure AdGuard Home Service
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF
          chmod +x builder/files/etc/init.d/adguardhome

      # 7. 动态打包 RootFS
      - name: Build RootFS
        run: |
          cd builder

          # 自动读取本地离线包包名
          LOCAL_PKGS=""
          if ls packages/*.apk >/dev/null 2>&1; then
            for f in packages/*.apk; do
              P_NAME=$(apk info --pkgname "$f" 2>/dev/null || true)
              if [ -n "$P_NAME" ]; then
                LOCAL_PKGS="$LOCAL_PKGS $P_NAME"
              fi
            done
          fi

          echo "自动解析到的本地包名: $LOCAL_PKGS"

          BASE_PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-app-uhttpd luci-i18n-uhttpd-zh-cn \
            luci-app-acme openssl-util px5g-standalone \
            xray-core sing-box chinadns-ng ipt2socks tcping geoview \
            luci-app-adguardhome luci-i18n-adguardhome-zh-cn \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq"

          ALL_PACKAGES="$BASE_PACKAGES $LOCAL_PKGS"

          make image PROFILE="" PACKAGES="$ALL_PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布编译产物到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS
          body: |
            ## ImmortalWrt 25.12.1 (ARMSR / armv8) 自动构建
            - **架构 / 包管理器**: ARMSR (ARM64) / APK
            - **内置组件**: 
              - PassWall 2 (支持 Xray / Sing-box)
              - Nikki (Mihomo 核心)
              - MosDNS & AdGuard Home
              - Web HTTP/HTTPS 控制面板 (uHTTPd 管理界面)
              - ACME 证书工具链
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build ImmortalWrt 25.12.1 (ARMSR + Nftables + Proxy Core)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月 1 日 0:00 触发 (北京时间 08:00)
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      # 3. 提取 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          # 增加 curl 稳定性参数
          IB_FILE=$(curl --retry 5 -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl --retry 5 -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (精确提取 25.12 及增加重试机制)
      - name: Download & Integrate Offline Packages
        run: |
          mkdir -p builder/packages
          cd builder/packages

          CURL_OPT="--retry 5 --retry-connrefused --retry-delay 2 -sSL"

          # 1) Nikki (精准过滤，只保留 25.12 和 all 的 apk/tar.gz，抛弃 24.10)
          echo "==> 正在获取 Nikki..."
          NK_JSON=$(curl $CURL_OPT "https://api.github.com/repos/nikkinikki-org/OpenWrt-nikki/releases/latest")
          NK_URLS=$(echo "$NK_JSON" | jq -r '.assets[].browser_download_url // empty' | grep -E '(25\.12\.tar\.gz|all\.apk)')
          for url in $NK_URLS; do
            echo "下载: $url"
            curl $CURL_OPT -O "$url"
          done

          # 2) MosDNS
          echo "==> 正在获取 MosDNS..."
          MD_JSON=$(curl $CURL_OPT "https://api.github.com/repos/sbwml/luci-app-mosdns/releases/latest")
          MD_URLS=$(echo "$MD_JSON" | jq -r '.assets[].browser_download_url // empty' | grep -E '(aarch64|all)\.apk')
          for url in $MD_URLS; do
            echo "下载: $url"
            curl $CURL_OPT -O "$url"
          done

          # 3) PassWall2
          echo "==> 正在获取 PassWall2..."
          PW_JSON=$(curl $CURL_OPT "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest" || echo "")
          PW_URLS=$(echo "$PW_JSON" | jq -r '.assets[].browser_download_url // empty' | grep -iE '(luci-app-passwall2.*\.apk|luci-i18n-passwall2-zh-cn.*\.apk|passwall_packages_apk_aarch64_generic\.zip)' || true)
          if [ -n "$PW_URLS" ]; then
            for url in $PW_URLS; do
              echo "下载: $url"
              curl $CURL_OPT -O "$url"
            done
          else
            echo "API获取失败，使用兜底下载链接..."
            curl $CURL_OPT -O "https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/25.12.25-1/luci-app-passwall2-25.12.25-r1.apk"
            curl $CURL_OPT -O "https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/25.12.25-1/luci-i18n-passwall2-zh-cn-25.12.25.apk"
            curl $CURL_OPT -O "https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/25.12.25-1/passwall_packages_apk_aarch64_generic.zip"
          fi

          # 解压软件包
          for archive in *.zip *.tar.gz; do
            [ -e "$archive" ] || continue
            if [[ "$archive" == *.zip ]]; then
              unzip -o "$archive" || true
            elif [[ "$archive" == *.tar.gz ]]; then
              tar -zxvf "$archive" || true
            fi
            rm -f "$archive"
          done

          # 提升子目录 apk 到根目录
          find . -mindepth 2 -name "*.apk" -exec mv {} . \;

          # 清理有冲突或无用的旧组件
          rm -f mihomo-alpha*.apk 2>/dev/null || true

          # 注入允许未签名包的参数
          sed -i 's/--no-network/--no-network --allow-untrusted/g' ../Makefile 2>/dev/null || true

          # 提取离线包名称列表
          OFFLINE_PKGS=""
          for apk in *.apk; do
            pkgname=$(tar -Ozxf "$apk" .PKGINFO 2>/dev/null | grep "^pkgname = " | cut -d' ' -f3 | tr -d '\r' || true)
            if [ -z "$pkgname" ]; then
              pkgname=$(echo "$apk" | sed -E 's/_[0-9].*\.apk$//; s/-[0-9].*\.apk$//')
            fi
            OFFLINE_PKGS="$OFFLINE_PKGS $pkgname"
          done
          
          OFFLINE_PKGS=$(echo "$OFFLINE_PKGS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "OFFLINE_PKGS=$OFFLINE_PKGS" >> $GITHUB_ENV

      # 5. 生成自定义系统配置
      - name: Inject Custom Configuration
        run: |
          FILES_DIR="builder/files/etc/uci-defaults"
          mkdir -p "$FILES_DIR"

          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh
          
          # 系统时间设置
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci commit system

          # 激活 KMS
          if [ -f /etc/config/vlmcsd ]; then
            uci set vlmcsd.config.enabled='1'
            uci commit vlmcsd
          fi
          [ -f /etc/init.d/vlmcsd ] && /etc/init.d/vlmcsd enable

          # 避免网络冲突，默认关闭自启
          [ -f /etc/init.d/nikki ] && /etc/init.d/nikki disable
          [ -f /etc/init.d/passwall ] && /etc/init.d/passwall disable
          [ -f /etc/init.d/mosdns ] && /etc/init.d/mosdns disable

          exit 0
          EOF
          chmod +x "$FILES_DIR/99-custom-init.sh"

      # 6. 生成版本说明
      - name: Generate Release Body
        run: |
          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          
          cat <<EOF > $GITHUB_WORKSPACE/release_body.md
          ## ImmortalWrt 25.12.1 (ARMSR / Pure Nftables) 构建
          - **构建日期**: $BUILD_DATE
          - **核心环境**: 已完全剔除 iptables 组件，**纯净 nftables 环境** (依赖 kmod-nft 族)。
          - **代理引擎**: 底层已强制包含 \`xray-core\` 和 \`sing-box\`，完美适配 PassWall VLESS 节点。
          - **集成插件**: Nikki, MosDNS, PassWall2, SoftEtherVPN
          EOF

      # 7. 打包 RootFS (强化网络环境与代理核心)
      - name: Build RootFS
        run: |
          cd builder
          
          # =========================================================
          # 核心改动：
          # 1. -iptables* 剔除所有 iptables 相关兼容层，纯净使用 nftables
          # 2. 补全 kmod-nft-tproxy, kmod-nft-socket 等 Nftables 劫持模块
          # 3. 加入 xray-core 和 sing-box 以支持 PassWall 运行 VLESS
          # =========================================================
          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates unzip \
            nftables kmod-nft-core kmod-nft-nat kmod-nft-tproxy kmod-nft-socket kmod-nft-fib kmod-tun kmod-dummy yq \
            -iptables -iptables-nft -iptables-legacy -ip6tables -ip6tables-nft -ip6tables-legacy \
            -dnsmasq dnsmasq-full \
            -ip-tiny ip-full \
            xray-core sing-box \
            ${{ env.OFFLINE_PKGS }}"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-nft-proxy-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布至 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS Nftables (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

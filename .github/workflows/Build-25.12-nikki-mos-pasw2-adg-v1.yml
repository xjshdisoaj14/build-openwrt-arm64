name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月 1 日 0:00 触发 (北京时间 08:00)
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip

      # 3. 提取 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (Nikki + MosDNS + PassWall2)
      - name: Download & Integrate Offline Packages
        run: |
          mkdir -p builder/packages
          cd builder/packages

          download_latest_assets() {
            local repo=$1
            echo "==> 正在获取 $repo 的最新 Releases..."
            local rel_json=$(curl -sL "https://api.github.com/repos/$repo/releases/latest")
            local urls=$(echo "$rel_json" | jq -r '.assets[].browser_download_url // empty' | grep -E '(aarch64|arm64|all|\.apk|\.ipk)' || true)
            
            for url in $urls; do
              echo "正在下载: $url"
              curl -sSL -O "$url"
            done
          }

          # 1) Nikki
          download_latest_assets "nikkinikki-org/OpenWrt-nikki"

          # 2) MosDNS
          download_latest_assets "sbwml/luci-app-mosdns"

          # 3) PassWall2 (精准匹配主程序及 aarch64 依赖包)
          echo "==> 正在获取 Openwrt-Passwall/openwrt-passwall2 的最新 Releases..."
          PW_JSON=$(curl -sL "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest" || echo "")
          PW_URLS=$(echo "$PW_JSON" | jq -r '.assets[].browser_download_url // empty' | grep -iE '(luci-app-passwall2.*\.apk|luci-i18n-passwall2-zh-cn.*\.apk|passwall_packages_apk_aarch64_generic\.zip)' || true)

          if [ -n "$PW_URLS" ]; then
            for url in $PW_URLS; do
              echo "正在下载: $url"
              curl -sSL -O "$url"
            done
          else
            echo "未匹配到 PassWall2 最新版，采用指定兜底版本..."
            curl -sSL -O "https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/25.12.25-1/luci-app-passwall2-25.12.25-r1.apk"
            curl -sSL -O "https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/25.12.25-1/luci-i18n-passwall2-zh-cn-25.12.25.apk"
            curl -sSL -O "https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/download/25.12.25-1/passwall_packages_apk_aarch64_generic.zip"
          fi

          # 解压软件包
          for archive in *.zip *.tar.gz; do
            [ -e "$archive" ] || continue
            if [[ "$archive" == *.zip ]]; then
              unzip -o "$archive" || true
            elif [[ "$archive" == *.tar.gz ]]; then
              tar -zxvf "$archive" || true
            fi
            rm -f "$archive"
          done

          # 提升子目录 apk 到根目录
          find . -mindepth 2 -name "*.apk" -exec mv {} . \;

          # 排坑 1：彻底消灭依赖树冲突 (解决 Error 7)
          echo "==> 正在剔除冲突的核心组件 (mihomo-alpha)..."
          rm -f mihomo-alpha*.apk 2>/dev/null || true

          # 排坑 2：贯彻落实 --allow-untrusted (解决 UNTRUSTED signature 警告)
          echo "==> 注入 --allow-untrusted 以信任所有第三方离线包..."
          sed -i 's/--no-network/--no-network --allow-untrusted/g' ../Makefile 2>/dev/null || true

          # 提取稳定的离线包名称列表，增强截取逻辑防止包名解析错乱
          OFFLINE_PKGS=""
          for apk in *.apk; do
            pkgname=$(tar -Ozxf "$apk" .PKGINFO 2>/dev/null | grep "^pkgname = " | cut -d' ' -f3 | tr -d '\r' || true)
            if [ -z "$pkgname" ]; then
              # 若解析失败，通过更严格的正则是安全剥离版本号 (例如：xray-core-1.8.4-1-aarch64.apk -> xray-core)
              pkgname=$(echo "$apk" | sed -E 's/_[0-9].*\.apk$//; s/-[0-9].*\.apk$//')
            fi
            OFFLINE_PKGS="$OFFLINE_PKGS $pkgname"
          done
          
          OFFLINE_PKGS=$(echo "$OFFLINE_PKGS" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "解析出的离线包清单: $OFFLINE_PKGS"
          echo "OFFLINE_PKGS=$OFFLINE_PKGS" >> $GITHUB_ENV

      # 5. 生成自定义系统配置
      - name: Inject Custom Configuration
        run: |
          FILES_DIR="builder/files/etc/uci-defaults"
          mkdir -p "$FILES_DIR"

          # 优化后的初始化脚本
          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh
          
          # 1. 基础系统设置
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci commit system

          # 2. 启用 vlmcsd (KMS 服务)
          if [ -f /etc/config/vlmcsd ]; then
            uci set vlmcsd.config.enabled='1'
            uci commit vlmcsd
          fi
          [ -f /etc/init.d/vlmcsd ] && /etc/init.d/vlmcsd enable

          # =========================================================
          # 避坑指北：绝对不能同时 enable Nikki 和 PassWall2 
          # 开机时它们会同时抢占 DNS (53) 和 TProxy 端口导致双双瘫痪。
          # 改进：默认安装好，由用户在 LuCI 界面明确选择启用哪个！
          # =========================================================
          [ -f /etc/init.d/nikki ] && /etc/init.d/nikki disable
          [ -f /etc/init.d/passwall ] && /etc/init.d/passwall disable
          [ -f /etc/init.d/mosdns ] && /etc/init.d/mosdns disable

          exit 0
          EOF
          chmod +x "$FILES_DIR/99-custom-init.sh"

      # 6. 提取主要组件与内核版本号
      - name: Collect Software Versions
        run: |
          KERNEL_VER=$(grep -i "LINUX_VERSION" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ' || echo "25.12 Standard Kernel")
          cd builder/packages
          
          GET_VER() {
            local file=$(ls $1*.apk 2>/dev/null | head -n1)
            if [ -n "$file" ]; then
              echo "$file" | sed -E 's/^[^-_]+[-_]//; s/_aarch64\.apk$|_all\.apk$|\.apk$//'
            else
              echo "最新发布版"
            fi
          }

          NIKKI_VER=$(GET_VER "nikki")
          LUCI_NIKKI_VER=$(GET_VER "luci-app-nikki")
          MOSDNS_VER=$(GET_VER "mosdns")
          PASSWALL2_VER=$(GET_VER "luci-app-passwall2")
          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          cat <<EOF > $GITHUB_WORKSPACE/release_body.md
          ## ImmortalWrt 25.12.1 (ARMSR / armv8) 优化版构建
          - **构建日期**: $BUILD_DATE
          - **构建 ID**: ${{ github.run_id }}
          - **架构 / 包管理器**: ARMSR (ARM64) / APK
          ### 📦 核心组件版本清单
          - **Linux Kernel**: \`$KERNEL_VER\`
          - **Nikki Core**: \`$NIKKI_VER\`
          - **LuCI App Nikki**: \`$LUCI_NIKKI_VER\`
          - **MosDNS**: \`$MOSDNS_VER\`
          - **PassWall2**: \`$PASSWALL2_VER\`
          ### 🛠 集成软件列表
          - **核心环境修复**: 已自动替换 \`dnsmasq-full\` 与 \`ip-full\`，保障透明代理可用性。
          - **代理与 DNS**: Nikki (内置 Mihomo 核心)、MosDNS、PassWall2
          - **VPN/网络服务**: SoftEtherVPN、VLMCSD (KMS)、VSFTPD、SFTP-Server
          - **网络增强工具**: nftables、iptables-nft、kmod-nft-tproxy、kmod-tun、curl、wget-ssl、yq
          EOF

      # 7. 打包 RootFS
      - name: Build RootFS
        run: |
          cd builder
          
          # =========================================================
          # 核心修复区：解决编译成功但插件用不了的 BUG
          # 1. 增加 `-dnsmasq dnsmasq-full` 强制剔除阉割版，装满血版，否则 PW2 分流崩溃
          # 2. 增加 `-ip-tiny ip-full` 获取完整的策略路由支持
          # 3. 增加 `iptables-nft` 作为底层规则的兼容桥梁
          # =========================================================
          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables iptables-nft kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq \
            -dnsmasq dnsmasq-full \
            -ip-tiny ip-full \
            ${{ env.OFFLINE_PKGS }}"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 8. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs-optimize-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布编译产物到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS Optimize (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

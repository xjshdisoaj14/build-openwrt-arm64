name: Build ImmortalWrt 25.12.1 (ARMSR + Native Nikki + FW4)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name'
        required: false
        default: 'v25.12.1-armsr'

jobs:
  build:
    name: Build ImmortalWrt RootFS & Images
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链及 HTTPS/CA 依赖
      - name: Prepare Build Tools & Certificates
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq ca-certificates
          sudo update-ca-certificates

      # 3. 直连提取 ImageBuilder (25.12.1 / armsr/armv8)
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sSL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 下载并预置 HTTPS/SSL 根证书至镜像系统中
      - name: Embed System CA Certificates
        run: |
          mkdir -p builder/files/etc/ssl/certs
          cp /etc/ssl/certs/ca-certificates.crt builder/files/etc/ssl/certs/ca-certificates.crt

      # 5. 精准获取并集成 Nikki (Mihomo UI) 最新 Release 离线 APK 包
      - name: Download & Integrate Nikki (APK Format for 25.x)
        run: |
          mkdir -p builder/packages
          cd builder/packages

          echo "==> 从 GitHub API 获取 Nikki 最新 Releases..."
          RELEASE_JSON=$(curl -sSL https://api.github.com/repos/nikkinikki-org/OpenWrt-nikki/releases/latest)

          # 提取适用于 armsr (aarch64/armv8) 的 apk 或 tar.gz 文件
          DOWNLOAD_URLS=$(echo "$RELEASE_JSON" | jq -r '.assets[].browser_download_url' | grep -E '(aarch64|arm64|all|\.apk|\.tar\.gz)')

          for URL in $DOWNLOAD_URLS; do
            echo "正在下载 Nikki 组件: $URL"
            curl -sSL -O "$URL"
          done

          # 处理下载到的 tar.gz 压缩包，解压提取 .apk 文件
          for TARBALL in *.tar.gz; do
            if [ -f "$TARBALL" ]; then
              tar -zxvf "$TARBALL"
              rm -f "$TARBALL"
            fi
          done

          echo "当前集成至 ImageBuilder 本地 packages 目录的文件："
          ls -la

      # 6. 集成 AdGuard Home 二进制 (ARM64)
      - name: Integrate AdGuard Home Binary
        run: |
          mkdir -p builder/files/opt/AdGuardHome
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.77/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C /tmp/
          mv /tmp/AdGuardHome/AdGuardHome builder/files/opt/AdGuardHome/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 7. 配置 AdGuard Home 服务自启动 (Procd)
      - name: Configure AdGuard Home Service
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF

          chmod +x builder/files/etc/init.d/adguardhome

      # 8. 打包 RootFS 与 镜像文件 (FW4 + APK 适配包)
      - name: Build RootFS and Firmware Images
        run: |
          cd builder

          # OpenWrt/ImmortalWrt 25.x 推荐的包依赖表 (使用 FW4 / nftables 架构)
          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            nikki \
            luci-app-nikki \
            luci-i18n-nikki-zh-cn \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-bundle ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq"

          # ARMSR 架构的 Profile 通常为 generic
          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 9. 整理并压缩产物
      - name: Prepare Artifacts for Release
        run: |
          mkdir -p release_files
          # 复制 RootFS tar.gz 压缩包
          cp builder/bin/targets/armsr/armv8/*rootfs.tar.gz release_files/ 2>/dev/null || true
          # 复制完整的构建镜像文件（如 .img.gz 或 .iso）
          cp builder/bin/targets/armsr/armv8/*generic* release_files/ 2>/dev/null || true
          
          echo "==> 准备上传的文件列表："
          ls -lh release_files/

      # 10. 上传 Artifact 至 Actions 存储 (7天保留)
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr
          path: release_files/*
          if-no-files-found: error
          retention-days: 7

      # 11. 发布编译产物到 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v25.12.1-armsr' }}
          name: "ImmortalWrt 25.12.1 ARMSR Auto Build"
          body: |
            ## ImmortalWrt 25.12.1 (ARMSR / ARMv8) 自动构建产物
            - **内核/架构**: ARMSR / armv8 (64-bit)
            - **包管理器**: APK (OpenWrt 25.x 原生)
            - **防火墙**: FW4 (nftables / tproxy)
            - **核心预装**: Native Nikki (Mihomo UI)、AdGuard Home Binary、Argon Theme、HTTPS/CA Certificates。
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

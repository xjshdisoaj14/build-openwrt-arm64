name: Build ImmortalWrt 25.12.1 (ARMSRoot + Nikki / PassWall2 双代理)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月 1 日 0:00 触发 (北京时间 08:00)
  - cron: '0 0 1 2,4,6,8,10,12 *'


jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链与依赖
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq unzip openssl

      # 3. 提取 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (Nikki + PassWall2)
      #
      # 为什么必须从 GitHub Releases 拉，不能只写进 PACKAGES：
      #   ① ImmortalWrt 25.12 的 luci 源里**没有 passwall2**，只有 luci-app-passwall
      #      （v1，iptables/fw3 那套）；immortalwrt/luci 仓库也已删掉 passwall2 目录。
      #      直接写 PACKAGES 会 "package not found" 直接失败。
      #   ② Nikki 同样不在官方源。
      #   ③ PassWall2 官方 release 同时给 .apk（25.12+）和 .ipk（24.10-），
      #      所以先探测 ImageBuilder 用哪个包管理器，再按后缀精确挑选，
      #      避免把 ipk 塞给 apk 管理器造成「装上了但没生效」。
      #
      # 选包规则：
      #   Nikki     → nikki_aarch64_generic-openwrt-25.12.tar.gz（内含 .apk）
      #   PassWall2 → luci-app-passwall2-*.apk + 中文语言包
      #               + packages_apk_aarch64_generic.zip
      #                 （上游自编译的核心与依赖：xray-core / sing-box /
      #                  chinadns-ng / geoview / hysteria / ipt2socks 等）
      - name: Download & Integrate Offline Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          GH_API="https://api.github.com"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          mkdir -p builder/packages
          cd builder/packages

          # ---------- 探测包管理器 ----------
          if [ -x ../staging_dir/host/bin/apk ]; then
            PKG_MGR=apk;  PKG_EXT=apk;  OWRT_SERIES=25.12
          elif [ -x ../staging_dir/host/bin/opkg ]; then
            PKG_MGR=opkg; PKG_EXT=ipk;  OWRT_SERIES=24.10
          else
            # 25.12 起默认 apk，兜底走 apk
            PKG_MGR=apk;  PKG_EXT=apk;  OWRT_SERIES=25.12
          fi
          echo "包管理器: ${PKG_MGR} (.${PKG_EXT})  上游系列: ${OWRT_SERIES}"
          {
            echo "PKG_EXT=${PKG_EXT}"
            echo "OWRT_SERIES=${OWRT_SERIES}"
          } >> "$GITHUB_ENV"

          latest_json() {
            curl -sSL --retry 3 --retry-delay 2 "${AUTH[@]}" "$GH_API/repos/$1/releases/latest"
          }

          asset_url() {  # asset_url <release-json> <grep-regex>
            echo "$1" | jq -r '.assets[].browser_download_url' | grep -E "$2" | head -n1 || true
          }

          DL=/tmp/dl
          mkdir -p "$DL"

          # 下载到 /tmp/dl/<URL 里的原始文件名>
          # 必须保留原文件名：后面靠后缀判断「这是包本身」还是「这是归档」，
          # 曾经把文件统一存成 xxx.pkg，结果 case 匹配不上、静默不处理，
          # 包一个都没进本地库，直到校验步骤才报错。
          fetch() {  # fetch <url>  → 回显本地路径
            local u="$1" n
            n=$(basename "${u%%\?*}")
            if [ -z "$n" ] || [ "$n" = "/" ]; then
              echo "::error::无法从 URL 解析文件名: $u" >&2
              return 1
            fi
            curl -sSL --retry 3 --retry-delay 2 -o "$DL/$n" "$u"
            if [ ! -s "$DL/$n" ]; then
              echo "::error::下载为空: $u" >&2
              return 1
            fi
            echo "$DL/$n"
          }

          install_pkg() {  # install_pkg <本地文件>：包本身直接拷，归档解开摊平
            local f="$1" d n
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "::error::install_pkg 收到空路径（上一步下载失败）"
              return 1
            fi
            case "$f" in
              *.apk|*.ipk)
                cp -f "$f" .
                echo "    收录: $(basename "$f")"
                return 0
                ;;
            esac

            d=$(mktemp -d)
            case "$f" in
              *.zip)          unzip -oq "$f" -d "$d" ;;
              *.tar.gz|*.tgz) tar -xzf "$f" -C "$d" ;;
              *.tar.xz)       tar -xJf "$f" -C "$d" ;;
              *.tar.zst)      tar --zstd -xf "$f" -C "$d" ;;
              *)
                echo "::warning::无法识别的文件类型，跳过: $(basename "$f")"
                rm -rf "$d"
                return 0
                ;;
            esac

            n=$(find "$d" -type f -name "*.${PKG_EXT}" | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "::warning::$(basename "$f") 里没找到 .${PKG_EXT}，实际内容："
              find "$d" -maxdepth 3 -type f | head -n 30 | sed "s|^$d/|      |"
            fi
            find "$d" -type f -name "*.${PKG_EXT}" -exec cp -f {} . \;
            rm -rf "$d"
          }

          # ---------- 1) Nikki (mihomo 内核) ----------
          echo "==> Nikki: 查询 nikkinikki-org/OpenWrt-nikki"
          NIKKI_JSON=$(latest_json nikkinikki-org/OpenWrt-nikki)
          NIKKI_URL=$(asset_url "$NIKKI_JSON" "nikki_aarch64_generic-openwrt-${OWRT_SERIES}\.tar\.gz$")
          if [ -z "$NIKKI_URL" ]; then
            echo "::error::Nikki 未找到 aarch64_generic / openwrt-${OWRT_SERIES} 的发布包"
            echo "$NIKKI_JSON" | jq -r '.assets[].name' | head -n 20
            exit 1
          fi
          echo "    $NIKKI_URL"
          NIKKI_FILE=$(fetch "$NIKKI_URL") || exit 1
          install_pkg "$NIKKI_FILE"

          # ---------- 2) PassWall2 (fw4 / nftables) ----------
          echo "==> PassWall2: 查询 Openwrt-Passwall/openwrt-passwall2"
          PW2_JSON=$(latest_json Openwrt-Passwall/openwrt-passwall2)

          PW2_APP_URL=$(asset_url "$PW2_JSON" "luci-app-passwall2-[^/]*\.${PKG_EXT}$")
          PW2_I18N_URL=$(asset_url "$PW2_JSON" "luci-i18n-passwall2-zh-cn-[^/]*\.${PKG_EXT}$")
          PW2_DEPS_URL=$(asset_url "$PW2_JSON" "packages_${PKG_MGR}_aarch64_generic\.zip$")

          if [ -z "$PW2_APP_URL" ]; then
            echo "::error::PassWall2 未找到 luci-app-passwall2 的 .${PKG_EXT} 包"
            echo "$PW2_JSON" | jq -r '.assets[].name' | grep -i passwall2 | head -n 20
            exit 1
          fi
          echo "    app : $PW2_APP_URL"
          echo "    i18n: ${PW2_I18N_URL:-（无中文语言包，跳过）}"
          echo "    deps: ${PW2_DEPS_URL:-（无依赖包，改用官方源解析）}"

          PW2_APP_FILE=$(fetch "$PW2_APP_URL") || exit 1
          install_pkg "$PW2_APP_FILE"

          if [ -n "$PW2_I18N_URL" ]; then
            PW2_I18N_FILE=$(fetch "$PW2_I18N_URL") || exit 1
            install_pkg "$PW2_I18N_FILE"
          fi

          if [ -n "$PW2_DEPS_URL" ]; then
            PW2_DEPS_FILE=$(fetch "$PW2_DEPS_URL") || exit 1
            install_pkg "$PW2_DEPS_FILE"
          fi

          # ---------- 3) 安全过滤 ----------
          # 上游 zip 是「核心 + 依赖」大礼包，个别版本会顺带打上系统级包。
          # 这些一旦覆盖官方版本，轻则内核模块版本对不上装不上，重则系统起不来。
          # 统一剔除，缺什么让官方源补。
          for bad in libc libgcc libopenssl libustream base-files busybox dnsmasq \
                     firewall4 nftables nftables-json nftables-nojson odhcpd netifd procd ubus uci; do
            rm -f "${bad}"-*.apk "${bad}"_*.apk "${bad}"-*.ipk "${bad}"_*.ipk 2>/dev/null || true
          done
          rm -f kmod-*.apk kmod-*.ipk kernel*.apk kernel*.ipk 2>/dev/null || true

          # ---------- 4) 硬性校验 ----------
          # 注意：这里只查「有没有以该名字开头的包」，不再假设分隔符是 - 还是 _，
          # 上游命名改过一次（nikki_1.26.2-r1_aarch64_generic.apk），写死会误判。
          MISSING=""
          for need in nikki luci-app-nikki luci-app-passwall2; do
            if ls -1 ${need}*.${PKG_EXT} >/dev/null 2>&1; then
              echo "OK: ${need} -> $(ls -1 ${need}*.${PKG_EXT} | head -n1)"
            else
              echo "::error::关键包 ${need} 没有落地"
              MISSING="$MISSING $need"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "===== 当前本地库实际内容 ====="
            ls -1
            echo "===== 下载缓存 /tmp/dl ====="
            ls -l "$DL" 2>/dev/null || true
            exit 1
          fi
          echo "OK: 关键包齐全"

          echo
          echo "===== 集成至 ImageBuilder 本地库的离线包清单 ====="
          ls -1 *.${PKG_EXT} | sort
          echo "共 $(ls -1 *.${PKG_EXT} | wc -l) 个"

      # 5. 生成自定义系统配置 (修复 uci: command not found 问题的关键)
      - name: Inject Custom Configuration
        run: |
          FILES_ROOT="builder/files"
          FILES_DIR="$FILES_ROOT/etc/uci-defaults"
          mkdir -p "$FILES_DIR"

          # 注入首次开机初始化脚本 (运行在真正的 OpenWrt 内部，确保 uci 命令可用)
          cat << 'EOF' > "$FILES_DIR/99-custom-init.sh"
          #!/bin/sh

          # 1. 配置语言与时区
          uci set system.@system[0].timezone='CST-8'
          uci set system.@system[0].zonename='Asia/Shanghai'
          uci commit system

          # 2. 启用 vlmcsd (KMS 服务)
          if [ -f /etc/config/vlmcsd ]; then
            uci set vlmcsd.config.enabled='1'
            uci commit vlmcsd
          fi

          # 3. 服务自启（软链接方式兜底）
          [ -f /etc/init.d/vlmcsd ] && /etc/init.d/vlmcsd enable

          # 4. 代理二选一：默认只开 Nikki，PassWall2 保持关闭。
          #    两套代理都会接管 DNS 与 nft 转发链，同时开启必然互相打架。
          #    要换 PassWall2：进系统执行 `proxy-mode passwall2`。
          [ -f /etc/init.d/passwall2 ] && /etc/init.d/passwall2 disable
          [ -f /etc/init.d/nikki ]     && /etc/init.d/nikki enable

          exit 0
          EOF

          chmod +x "$FILES_DIR/99-custom-init.sh"

          # ------------------------------------------------------------------
          # 代理互斥切换器 /usr/bin/proxy-mode
          #
          # 为什么需要：
          #   Nikki 与 PassWall2 都靠 nft + DNS 劫持实现透明代理，两套同时启用
          #   会出现 nft 规则互相覆盖、dnsmasq 上游被改两次，表现是「能连上但
          #   全都不通」。所以把「只开一个」做成命令，而不是靠人记住。
          #
          # 状态判定用 init 脚本自带的 `enabled` 子命令，比手抠 /etc/rc.d 稳。
          # ------------------------------------------------------------------
          mkdir -p "$FILES_ROOT/usr/bin"
          cat << 'EOF' > "$FILES_ROOT/usr/bin/proxy-mode"
          #!/bin/sh
          # proxy-mode —— Nikki / PassWall2 二选一切换器

          is_on() {
            [ -x "/etc/init.d/$1" ] && /etc/init.d/"$1" enabled >/dev/null 2>&1
          }

          svc() {  # svc <action> <name>
            [ -x "/etc/init.d/$2" ] || return 0
            /etc/init.d/"$2" "$1" >/dev/null 2>&1 || true
          }

          turn_off() {
            is_on "$1" && svc stop "$1"
            svc disable "$1"
            svc stop "$1"
          }

          turn_on() {
            if [ ! -x "/etc/init.d/$1" ]; then
              echo "错误: 找不到 /etc/init.d/$1，该插件可能没装进固件"
              exit 1
            fi
            svc enable "$1"
            svc start "$1"
          }

          show_status() {
            echo "nikki     : $(is_on nikki     && echo 已启用 || echo 未启用)"
            echo "passwall2 : $(is_on passwall2 && echo 已启用 || echo 未启用)"
          }

          usage() {
            cat <<'EOT'
          用法: proxy-mode <nikki|passwall2|off|status>

            nikki       启用 Nikki (mihomo 内核)，同时关闭 PassWall2
            passwall2   启用 PassWall2 (fw4 / nftables)，同时关闭 Nikki
            off         两个都关闭
            status      查看当前状态
          EOT
          }

          case "$1" in
          nikki)
            turn_off passwall2
            turn_on  nikki
            ;;
          passwall2)
            turn_off nikki
            turn_on  passwall2
            ;;
          off)
            turn_off nikki
            turn_off passwall2
            ;;
          status)
            show_status
            exit 0
            ;;
          *)
            usage
            show_status
            exit 1
            ;;
          esac

          # 切换后统一刷新 DNS 与防火墙，清掉上家残留的规则
          /etc/init.d/dnsmasq restart >/dev/null 2>&1 || true
          fw4 reload >/dev/null 2>&1 || true

          echo "已切换到: $1"
          show_status
          EOF

          chmod 755 "$FILES_ROOT/usr/bin/proxy-mode"

          # ------------------------------------------------------------------
          # 生成 LuCI 的 HTTPS 自签证书
          #
          # 为什么必须在构建阶段生成：
          #   实测固件里既没有 px5g 也没有 openssl，/etc/uhttpd.crt 和
          #   /etc/uhttpd.key 也不存在，而原厂 uhttpd 配置里只有 listen_http、
          #   根本没有 listen_https。三者叠加的结果就是 443 永远起不来，
          #   只能 http 登录。所以在构建机上用 openssl 生成好，随 files/ 烧进 rootfs。
          #
          # 说明：同一份固件重复刷写会共用这把私钥，局域网自用足够；
          #       介意的话刷完后在 LuCI 里换一张自己的证书。
          # ------------------------------------------------------------------
          mkdir -p "$FILES_ROOT/etc"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 3650 -subj "/C=CN/ST=Local/L=Local/O=OpenWrt/CN=192.168.123.22" -addext "subjectAltName=IP:192.168.123.22,IP:127.0.0.1,DNS:openwrt.lan" -keyout "$FILES_ROOT/etc/uhttpd.key" -out "$FILES_ROOT/etc/uhttpd.crt"
          chmod 600 "$FILES_ROOT/etc/uhttpd.key"
          chmod 644 "$FILES_ROOT/etc/uhttpd.crt"
          openssl x509 -in "$FILES_ROOT/etc/uhttpd.crt" -noout -subject -dates

          # ------------------------------------------------------------------
          # 注入：容器环境专用初始化（ujail / 网络 / IPv6 / DHCP / HTTPS）
          #
          # 为什么需要关 ujail：
          #   dnsmasq / sysntpd / vlmcsd 在 procd 里注册了 ujail（一层额外的
          #   mount namespace 沙箱）。在非特权 docker 容器里建不起来，两道墙：
          #     ① mount --make-rprivate /  被 AppArmor 的 docker-default 拒绝
          #        （策略里有 deny mount,）—— 关 seccomp 无效
          #     ② pivot_root(...) 被内核 EPERM —— 容器根是 overlay/bind，无解
          #   结果是 dnsmasq 无限 crash loop，53 端口不监听，DNS 全挂。
          #   容器本身就是隔离边界，ujail 在里面是冗余的第二层，可以关。
          #
          # 为什么加 /.dockerenv 判断：
          #   同一个 rootfs 拿到裸机上跑时 ujail 是完全正常的，那是 dnsmasq 被
          #   攻破后的最后一道墙，不该被去掉。所以只在容器里打这个补丁。
          #
          # 执行时机：
          #   uci-defaults 在 /etc/init.d/boot (S10boot) 里被 source，
          #   dnsmasq 是 S19 —— 补丁一定先于服务启动生效。
          #   文件名用 zz- 前缀，保证排在 12_ / 14_ / 15_ / 99_ 这些迁移脚本之后，
          #   不会被它们覆盖。
          #
          # 重要：本脚本内不出现任何反斜杠。
          #   旧版用 s/^\([[:space:]]*\)procd_add_jail/\1: .../ 的写法，经上游
          #   传递后 \( 和 \) 被吞成了 $，正则退化成「匹配空行」，sed 仍返回 0，
          #   于是静默假成功、补丁根本没打上。现在改成「行地址 + 直接替换」。
          # ------------------------------------------------------------------
          cat << 'EOF' > "$FILES_DIR/zz-container-config.sh"
          #!/bin/sh
          # 容器内一次性初始化，首启自动执行后自删。裸机直接退出。

          [ -f /.dockerenv ] || exit 0

          LAN_IP="192.168.123.22"
          LAN_GW="192.168.123.1"
          LAN_DNS="192.168.123.1"
          LAN_MASK="255.255.255.0"

          # 1) 关掉三个服务的内层 ujail
          #    行地址限定，避免误伤；打完补丁的行以 ": " 开头，天然幂等。
          for s in dnsmasq sysntpd vlmcsd; do
            f="/etc/init.d/$s"
            [ -f "$f" ] || continue
            sed -i -e '/^[[:space:]]*procd_add_jail/ s/procd_add_jail/: procd_add_jail/' "$f"
            chmod 755 "$f"
          done

          # 2) 静态 IP / 网关 / DNS
          #    这里写死的 LAN_IP 必须与 docker run 的 --ip 一致。
          #    不做自动探测：实测 S10boot 阶段 eth0 还是 DOWN 且没有 IPv4，
          #    探测只会拿到空值，反而容易留下幽灵地址。
          uci -q set network.lan.proto='static'
          uci -q set network.lan.ipaddr="$LAN_IP"
          uci -q set network.lan.netmask="$LAN_MASK"
          uci -q set network.lan.gateway="$LAN_GW"
          uci -q set network.lan.dns="$LAN_DNS"
          uci -q set network.lan.peerdns='0'
          uci -q delete network.lan.ip6assign

          # 3) 关掉 IPv6 的配置面
          #    内核面由 docker run 的 --sysctl 负责（容器里 /proc/sys 是只读的）
          uci -q set network.globals.ula_prefix=''
          uci -q set network.globals.packet_steering='0'

          # 4) 关掉 DHCP 服务端 / RA / NDP
          uci -q set dhcp.lan.ignore='1'
          uci -q set dhcp.lan.dhcpv4='disabled'
          uci -q set dhcp.lan.dhcpv6='disabled'
          uci -q set dhcp.lan.ra='disabled'
          uci -q set dhcp.lan.ndp='disabled'
          uci -q delete dhcp.lan.start
          uci -q delete dhcp.lan.limit
          uci -q delete dhcp.lan.leasetime
          uci -q delete dhcp.lan.dhcp_option
          uci -q set dhcp.odhcpd.enabled='0'

          uci -q commit network
          uci -q commit dhcp

          /etc/init.d/odhcpd disable 2>/dev/null
          rm -f /etc/rc.d/S*odhcpd /etc/rc.d/S*sysntpd

          # 5) 关掉容器里多余的 NTP 客户端
          #    容器与宿主共用内核时钟，且没有 CAP_SYS_TIME，sysntpd 只会无限重启
          uci -q set system.ntp.enabled='0'
          uci -q commit system

          # 6) 打开 HTTPS
          #    IPv6 已关，监听只留 IPv4，避免 uhttpd 去 bind [::]:80 失败。
          uci -q delete uhttpd.main.listen_http
          uci -q add_list uhttpd.main.listen_http='0.0.0.0:80'
          uci -q delete uhttpd.main.listen_https
          uci -q add_list uhttpd.main.listen_https='0.0.0.0:443'
          uci -q set uhttpd.main.cert='/etc/uhttpd.crt'
          uci -q set uhttpd.main.key='/etc/uhttpd.key'
          uci -q set uhttpd.main.redirect_https='0'
          uci -q commit uhttpd

          # 7) 留个标记文件，方便排查
          #    S10boot 时 logd 还没起来（S12log），logger 的消息会丢，所以写文件。
          {
            echo "lan=$LAN_IP gw=$LAN_GW dns=$LAN_DNS dhcp=off https=on"
            echo "ujail disabled at $(date)"
          } > /etc/.nojail-applied

          exit 0
          EOF

          chmod +x "$FILES_DIR/zz-container-config.sh"

          echo "===== files/ 预置内容 ====="
          ls -l "$FILES_ROOT/etc" "$FILES_DIR" "$FILES_ROOT/usr/bin"

      # 6. 提取主要组件与内核版本号
      - name: Collect Software Versions
        run: |
          EXT="${PKG_EXT:-apk}"

          # 1. 提取内核版本号
          KERNEL_VER=$(grep -E -h "LINUX_VERSION-[0-9]" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ')
          if [ -z "$KERNEL_VER" ] && [ -f builder/.config ]; then
            KERNEL_VER=$(grep CONFIG_LINUX_ builder/.config 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          fi
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER="25.12 Standard Kernel"
          fi
          echo "Parsed Kernel Version: $KERNEL_VER"

          # 2. 从本地离线包文件名里抠版本号
          #    上游命名有两套：nikki_1.26.2-r1_aarch64_generic.apk
          #                    luci-app-passwall2-26.10.29-r1.apk
          #    统一按「去前缀 → 去架构后缀 → 去扩展名」处理。
          getver() {
            local base="$1" f
            f=$(ls -1 "${base}"*.${EXT} 2>/dev/null | head -n1)
            [ -n "$f" ] || f=$(ls -1 "${base}"[-_]*.${EXT} 2>/dev/null | head -n1)
            [ -n "$f" ] || { echo "未知"; return 0; }
            echo "$f" | sed -E "s/^${base}[-_]?//; s/[-_](aarch64|arm|x86_64|mipsel|mips)[a-z0-9_-]*\.${EXT}$//; s/[-_]all\.${EXT}$//; s/\.${EXT}$//"
          }

          cd builder/packages
          NIKKI_VER=$(getver nikki)
          LUCI_NIKKI_VER=$(getver luci-app-nikki)
          PASSWALL2_VER=$(getver luci-app-passwall2)
          echo "Nikki=$NIKKI_VER  LuCI-Nikki=$LUCI_NIKKI_VER  PassWall2=$PASSWALL2_VER"

          # 3. 获取北京时间 (UTC+8)
          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')

          # 4. 写入环境变量
          {
            echo "KERNEL_VER=$KERNEL_VER"
            echo "NIKKI_VER=$NIKKI_VER"
            echo "LUCI_NIKKI_VER=$LUCI_NIKKI_VER"
            echo "PASSWALL2_VER=$PASSWALL2_VER"
            echo "BUILD_DATE=$BUILD_DATE"
          } >> "$GITHUB_ENV"

          # 5. 写 Release 说明
          #
          # 必须用单引号 heredoc + 占位符替换，不要用会展开的 heredoc：
          # 说明里全是反引号和 $，直接展开会被当成命令替换执行，
          # 末尾的 `\` 续行也会把 docker 命令粘成一行。
          cat <<'BODY' > "$GITHUB_WORKSPACE/release_body.md"
          ## ImmortalWrt 25.12.1 (ARMSR / armv8) OECT 版

          - **构建日期**: @BUILD_DATE@
          - **构建 ID**: @RUN_ID@
          - **架构 / 包管理器**: ARMSR (ARM64) / APK

          ### 核心组件版本
          - **Linux Kernel**: `@KERNEL_VER@`
          - **Nikki Core**: `@NIKKI_VER@`（LuCI `@LUCI_NIKKI_VER@`）
          - **PassWall2**: `@PASSWALL2_VER@`

          ### 两套代理方案，二选一
          两套插件**都已预装**，但**默认只启用 Nikki**。它们都会接管 DNS 与 nft
          转发链，同时开启会互相覆盖规则，所以用内置命令切换，不要手工双开：

          ```sh
          proxy-mode nikki        # 用 Nikki（mihomo 内核），自动关闭 PassWall2
          proxy-mode passwall2    # 用 PassWall2（fw4 / nftables），自动关闭 Nikki
          proxy-mode off          # 两个都关
          proxy-mode status       # 看当前状态
          ```

          | 方案 | 内核 | 防火墙 | 特点 |
          |---|---|---|---|
          | Nikki | mihomo | nftables | 订阅导入简单，规则生态好，带面板 |
          | PassWall2 | Xray / Sing-Box 等多核心 | fw4 (nftables) | 分流更细，节点类型支持更全 |

          ### 关于去广告
          本固件**不预装** AdBlock 一类的 DNS 过滤插件。需要拦截广告时用 Nikki
          自带的 mihomo 规则：在 Nikki 的配置里启用 `rule-provider`，挂
          `category-ads-all` 这类规则集即可，无需额外装包。PassWall2 本身没有
          广告过滤能力。

          ### 集成软件列表
          - **代理**: Nikki (mihomo)、PassWall2 (fw4)
          - **服务**: VLMCSD (KMS)、VSFTPD、SFTP-Server
          - **网络工具**: nftables-json、kmod-nft-tproxy、kmod-nft-socket、
            kmod-nft-nat、kmod-nft-fullcone、kmod-tun、kmod-dummy、
            curl、wget-ssl、yq

          ### 容器适配（开箱即用，无需进容器改配置）
          - 首启自动检测容器环境（`/.dockerenv`），关闭 dnsmasq / sysntpd / vlmcsd
            的 ujail 内层沙箱，使本 rootfs 可在**非特权** docker 容器中正常提供 DNS。
          - 网络已预置：LAN `192.168.123.22/24`，网关与 DNS `192.168.123.1`。
          - DHCP 服务端 / RA / NDP / odhcpd 全部关闭，IPv6 配置面关闭。
          - LuCI 已启用 HTTPS（自签证书，CN=192.168.123.22，10 年有效），
            `http://` 与 `https://` 双通道均可登录。
          - 裸机启动不做任何改动，ujail 与网络配置保持原样。

          ### 启动命令
          ```bash
          docker run -d --name openwrt --restart unless-stopped \
            --network macnet --ip 192.168.123.22 \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            --sysctl net.ipv6.conf.default.disable_ipv6=1 \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add MKNOD --cap-add SYS_ADMIN \
            --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /tmp --tmpfs /run --tmpfs /var/lock \
            --device /dev/net/tun \
            openwrt:25oect /sbin/init
          ```
          BODY

          sed -i \
            -e "s|@BUILD_DATE@|${BUILD_DATE}|g" \
            -e "s|@RUN_ID@|${GITHUB_RUN_ID}|g" \
            -e "s|@KERNEL_VER@|${KERNEL_VER}|g" \
            -e "s|@NIKKI_VER@|${NIKKI_VER}|g" \
            -e "s|@LUCI_NIKKI_VER@|${LUCI_NIKKI_VER}|g" \
            -e "s|@PASSWALL2_VER@|${PASSWALL2_VER}|g" \
            "$GITHUB_WORKSPACE/release_body.md"

          echo "===== release_body.md 前 20 行 ====="
          head -n 20 "$GITHUB_WORKSPACE/release_body.md"

      # 7. 打包 RootFS
      #
      # 关于包名的两个坑（都实测过，别改回去）：
      #   ① 25.12 里没有名为 `nftables` 的包了，已拆成 nftables-json /
      #      nftables-nojson 两个实体包。写 `nftables` 只能靠 PROVIDES 兜底，
      #      属于碰运气，这里直接写实体名。
      #   ② luci-i18n-nikki-zh-cn / luci-i18n-passwall2-zh-cn 是第三方产物，
      #      上游哪天不发中文包了，写死就会让整次构建失败。所以按「下载到才加」处理。
      - name: Build RootFS
        run: |
          cd builder

          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-app-passwall2 \
            nikki luci-app-nikki \
            luci-app-vlmcsd luci-i18n-vlmcsd-zh-cn \
            curl wget-ssl ca-certificates \
            nftables-json kmod-nft-tproxy kmod-nft-socket kmod-nft-nat \
            kmod-nft-fullcone kmod-tun kmod-dummy yq"

          for p in luci-i18n-passwall2-zh-cn luci-i18n-nikki-zh-cn; do
            if ls packages/${p}*.apk >/dev/null 2>&1; then
              PACKAGES="$PACKAGES $p"
            else
              echo "::warning::$p 未下载到，跳过（对应界面显示英文）"
            fi
          done

          echo "===== 最终 PACKAGES ====="
          echo "$PACKAGES"

          make image PROFILE="generic" PACKAGES="$PACKAGES" FILES="files" -j$(nproc)

      # 7.2 只保留需要的那一个 rootfs 产物
      #
      # 为什么要这一步：
      #   ImageBuilder 会同时产出两个 tar 包——
      #     immortalwrt-...-generic-rootfs.tar.gz         ← 我们要的
      #     immortalwrt-...-generic-targz-rootfs.tar.gz   ← 多余的
      #
      #   前者来自 include/image.mk 里的：
      #     $(if $(CONFIG_TARGET_ROOTFS_TARGZ),
      #        IMAGE/rootfs.tar.gz := append-rootfs
      #        $(eval $(call Device/Build/image,targz,rootfs.tar.gz,$(1))))
      #   ——也就是说「我们要的那个」恰恰是 targz 后端产出的，所以**不能**去关
      #   CONFIG_TARGET_ROOTFS_TARGZ，一关它自己也消失。
      #
      #   后者是设备 IMAGES 列表里的另一项，只能改 ImageBuilder 内部的
      #   target/linux/armsr/image/Makefile 才能不生成，改坏了整次构建直接失败。
      #   所以采用「构建后精确剔除」，确定、可验证、不碰上游。
      - name: Keep Only Wanted RootFS
        run: |
          set -e
          D="builder/bin/targets/armsr/armv8"

          echo "===== make image 原始产出 ====="
          ls -l "$D"

          echo "===== 剔除多余 rootfs 包 ====="
          find "$D" -maxdepth 1 -type f -name '*rootfs.tar.gz' ! -name '*-generic-rootfs.tar.gz' -print
          find "$D" -maxdepth 1 -type f -name '*rootfs.tar.gz' ! -name '*-generic-rootfs.tar.gz' -delete

          echo "===== 清理后 ====="
          ls -l "$D"

          N=$(ls -1 "$D"/*-generic-rootfs.tar.gz 2>/dev/null | wc -l)
          [ "$N" -eq 1 ] || { echo "::error::期望恰好 1 个 *-generic-rootfs.tar.gz，实际 $N 个"; exit 1; }
          echo "OK: 只剩一个 rootfs 包"

      # 7.5 构建后自检：确认预置脚本真的进了 rootfs，而且内容没被写坏
      - name: Verify Injected Files
        run: |
          set -e
          ROOTFS=$(ls builder/bin/targets/armsr/armv8/*-generic-rootfs.tar.gz | head -n1)
          [ -f "$ROOTFS" ] || { echo "::error::没找到 *-generic-rootfs.tar.gz"; exit 1; }
          echo "RootFS: $ROOTFS"

          rm -rf /tmp/verify && mkdir -p /tmp/verify
          tar -xzf "$ROOTFS" -C /tmp/verify --wildcards '*uci-defaults/*' 2>/dev/null || true
          tar -xzf "$ROOTFS" -C /tmp/verify --wildcards '*etc/init.d/dnsmasq' 2>/dev/null || true
          tar -xzf "$ROOTFS" -C /tmp/verify --wildcards '*etc/uhttpd.crt' 2>/dev/null || true
          tar -xzf "$ROOTFS" -C /tmp/verify --wildcards '*etc/uhttpd.key' 2>/dev/null || true
          tar -xzf "$ROOTFS" -C /tmp/verify --wildcards '*usr/bin/proxy-mode' 2>/dev/null || true
          tar -xzf "$ROOTFS" -C /tmp/verify --wildcards '*etc/init.d/nikki' 2>/dev/null || true
          tar -xzf "$ROOTFS" -C /tmp/verify --wildcards '*etc/init.d/passwall2' 2>/dev/null || true

          F=$(find /tmp/verify -name 'zz-container-config.sh' | head -n1)
          [ -n "$F" ] || { echo "::error::初始化脚本没被打进 rootfs"; exit 1; }
          echo "found: $F"
          echo "----------- 脚本全文 -----------"
          cat "$F"
          echo "-------------------------------"

          echo "== A. 反斜杠污染检查 =="
          # 历史故障：\( 和 \) 被上游吞成 $，正则退化成「匹配空行」，sed 仍返回 0
          if grep -Fq '^$[[:space:]]' "$F"; then
            echo "::error::sed 表达式被写坏（反斜杠丢失，变成了 ^\$[[:space:]]）"
            exit 1
          fi
          grep -Fq 's/procd_add_jail/: procd_add_jail/' "$F" || { echo "::error::sed 语句丢失"; exit 1; }
          echo "OK: 表达式无污染"

          echo "== B. 表达式功能验证（拿真实 init 脚本的副本跑一遍）=="
          D=$(find /tmp/verify -path '*etc/init.d/dnsmasq' | head -n1)
          [ -n "$D" ] || { echo "::error::rootfs 里找不到 dnsmasq init"; exit 1; }
          cp "$D" /tmp/dtest
          sed -i -e '/^[[:space:]]*procd_add_jail/ s/procd_add_jail/: procd_add_jail/' /tmp/dtest
          N=$(grep -c '^[[:space:]]*: procd_add_jail' /tmp/dtest || true)
          [ "$N" -ge 1 ] || { echo "::error::补丁表达式在真实 init 脚本上无效"; exit 1; }
          echo "OK: 表达式有效，注释掉 $N 行"

          echo "== C. HTTPS 证书检查 =="
          CR=$(find /tmp/verify -name 'uhttpd.crt' | head -n1)
          KY=$(find /tmp/verify -name 'uhttpd.key' | head -n1)
          [ -n "$CR" ] && [ -n "$KY" ] || { echo "::error::HTTPS 证书没进 rootfs"; exit 1; }
          openssl x509 -in "$CR" -noout -subject -dates
          echo "OK: 证书已打包"

          echo "== D. 关键配置项检查 =="
          grep -Fq "LAN_IP=\"192.168.123.22\"" "$F" || { echo "::error::LAN_IP 不是 192.168.123.22"; exit 1; }
          grep -Fq "listen_https='0.0.0.0:443'" "$F" || { echo "::error::listen_https 缺失"; exit 1; }
          grep -Fq "dhcp.lan.ignore='1'" "$F" || { echo "::error::DHCP 未关闭"; exit 1; }
          echo "OK: 全部关键项就位"

          echo "== E. 双代理落地检查 =="
          PM=$(find /tmp/verify -name 'proxy-mode' | head -n1)
          [ -n "$PM" ] || { echo "::error::/usr/bin/proxy-mode 没进 rootfs"; exit 1; }
          [ -x "$PM" ] || { echo "::error::/usr/bin/proxy-mode 没有可执行权限"; exit 1; }
          grep -Fq 'passwall2' "$PM" && grep -Fq 'nikki' "$PM" || { echo "::error::proxy-mode 内容不完整"; exit 1; }
          echo "OK: proxy-mode 已就位"

          for p in nikki passwall2; do
            I=$(find /tmp/verify -path "*etc/init.d/$p" | head -n1)
            [ -n "$I" ] || { echo "::error::$p 没装进 rootfs"; exit 1; }
            echo "OK: /etc/init.d/$p 存在"
          done

          echo "== F. 已移除组件检查（直接查 tar 清单，不靠解包）=="
          LIST=$(tar -tzf "$ROOTFS")
          for gone in mosdns softethervpn adblock; do
            if echo "$LIST" | grep -qE "(etc/config|etc/init.d)/${gone}$"; then
              echo "::error::$gone 仍在 rootfs 里"
              exit 1
            fi
            echo "OK: $gone 已移除"
          done

      # 8. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs-dualproxy-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*-generic-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 9. 发布编译产物到 GitHub Releases
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmWrt 25.12.1 ARMRoot DualProxy (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*-generic-rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

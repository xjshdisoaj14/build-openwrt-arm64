name: Build ImmortalWrt 25.12.1 (ARMSR + Proxy Suite)

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间 (UTC) 每偶数月（2、4、6、8、10、12月）的 1 日凌晨 0:00 自动触发编译
    # 对应北京时间 (UTC+8) 2、4、6、8、10、12月的 1 日上午 08:00
    - cron: '0 0 1 */2 *'

jobs:
  build:
    name: Build ImmortalWrt RootFS
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备编译工具链
      - name: Prepare Build Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y make build-essential curl wget tar xz-utils zstd gawk qemu-utils dosfstools mtools jq

      # 3. 直连提取 ImageBuilder
      - name: Download & Extract ImageBuilder
        run: |
          TARGET_DIR="https://downloads.immortalwrt.org/releases/25.12.1/targets/armsr/armv8/"
          echo "Connecting to target repository: ${TARGET_DIR}"

          IB_FILE=$(curl -sL "$TARGET_DIR" | grep -oE 'immortalwrt-imagebuilder-[^"]+\.tar\.(zst|xz)' | head -n 1)

          if [ -z "$IB_FILE" ]; then
            echo "::error::未能在 25.12.1/armsr/armv8 找到 ImageBuilder 下载包！"
            exit 1
          fi

          DOWNLOAD_URL="${TARGET_DIR}${IB_FILE}"
          echo "Downloading ImageBuilder from: ${DOWNLOAD_URL}"

          curl -sL "$DOWNLOAD_URL" -o ib_package.archive
          mkdir -p builder

          if [[ "$IB_FILE" == *.zst ]]; then
            tar --zstd -xf ib_package.archive -C builder --strip-components=1
          else
            tar -xf ib_package.archive -C builder --strip-components=1
          fi
          rm -f ib_package.archive

      # 4. 获取并集成第三方离线包 (Nikki + MosDNS)
      - name: Download & Integrate Offline Packages
        run: |
          mkdir -p builder/packages
          cd builder/packages

          download_latest_assets() {
            local repo=$1
            echo "==> 正在获取 $repo 的最新 Releases..."
            local rel_json=$(curl -sL "https://api.github.com/repos/$repo/releases/latest")
            local urls=$(echo "$rel_json" | jq -r '.assets[].browser_download_url' | grep -E '(aarch64|arm64|all|\.apk|\.ipk)')
            for url in $urls; do
              echo "正在下载: $url"
              curl -sSL -O "$url"
            done
          }

          # 1) Nikki (内置 Mihomo 核心)
          download_latest_assets "nikkinikki-org/OpenWrt-nikki"

          # 2) MosDNS
          download_latest_assets "sbwml/luci-app-mosdns"

          # 解压处理
          for archive in *.tar.gz *.zip; do
            if [ -f "$archive" ]; then
              tar -zxvf "$archive" 2>/dev/null || unzip -o "$archive" 2>/dev/null || true
              rm -f "$archive"
            fi
          done

          find . -mindepth 2 -name "*.apk" -exec mv {} . \;

          echo "当前集成至 ImageBuilder 本地库的离线 APK 清单："
          ls -la *.apk || true

      # 5. 提取主要组件与内核版本号
      - name: Collect Software Versions
        run: |
          # 1. 提取内核版本号（从 ImageBuilder 包含的系统配置文件或包列表中查找）
          KERNEL_VER=$(grep -i "LINUX_VERSION" builder/include/kernel-*.mk 2>/dev/null | head -n1 | cut -d'=' -f2 | tr -d ' ' || echo "25.12 Standard Kernel")
          
          # 2. 提取离线包版本号
          cd builder/packages
          NIKKI_VER=$(ls nikki_*.apk 2>/dev/null | head -n1 | sed -E 's/nikki_(.*)_aarch64\.apk/\1/' || echo "最新发布版")
          LUCI_NIKKI_VER=$(ls luci-app-nikki_*.apk 2>/dev/null | head -n1 | sed -E 's/luci-app-nikki_(.*)_all\.apk/\1/' || echo "最新发布版")
          MOSDNS_VER=$(ls mosdns_*.apk 2>/dev/null | head -n1 | sed -E 's/mosdns_(.*)_aarch64\.apk/\1/' || echo "最新发布版")
          
          # 3. 获取编译当天日期 (UTC+8 北京时间)
          BUILD_DATE=$(ENV_TZ=Asia/Shanghai date +'%Y-%m-%d')

          # 4. 写入环境变量供后续步骤调用
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          
          # 写入 Release Body 变量文件
          cat <<EOF > $GITHUB_WORKSPACE/release_body.md
          ## ImmortalWrt 25.12.1 (ARMSR / armv8) 优化版构建
          
          - **构建日期**: $BUILD_DATE
          - **构建 ID**: ${{ github.run_id }}
          - **架构 / 包管理器**: ARMSR (ARM64) / APK
          
          ### 📦 核心组件版本清单
          - **Linux Kernel**: \`$KERNEL_VER\`
          - **Nikki Core**: \`$NIKKI_VER\`
          - **LuCI App Nikki**: \`$LUCI_NIKKI_VER\`
          - **MosDNS**: \`$MOSDNS_VER\`
          
          ### 🛠 集成软件列表
          - **代理与 DNS**: Nikki (内置 Mihomo 核心)、MosDNS
          - **VPN/网络服务**: SoftEtherVPN、VLMCSD (KMS)、VSFTPD、SFTP-Server
          - **网络增强工具**: nftables、kmod-nft-tproxy、kmod-tun、curl、wget-ssl、yq
          EOF

      # 6. 打包 RootFS
      - name: Build RootFS
        run: |
          cd builder

          PACKAGES="-odhcp6c -odhcpd-ipv6only -kmod-ipv6 \
            luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            nikki luci-app-nikki luci-i18n-nikki-zh-cn \
            mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates \
            nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun kmod-dummy yq"

          make image PROFILE="" PACKAGES="$PACKAGES" -j$(nproc)

      # 7. 上传 RootFS 编译产物到 Artifacts
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-armsr-rootfs-optimize-${{ env.BUILD_DATE }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      # 8. 发布编译产物到 GitHub Releases (使用版本信息与日期)
      - name: Upload RootFS to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ImmortalWrt-25.12.1-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: ImmortalWrt 25.12.1 ARMSR RootFS Optimize (${{ env.BUILD_DATE }})
          body_path: release_body.md
          files: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

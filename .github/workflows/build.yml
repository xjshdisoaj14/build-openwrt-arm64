name: Build ImmortalWrt ARM64 RootFS

on:
  workflow_dispatch:

env:
  IMMORTALWRT_VER: "25.12.1"
  ADGUARD_VER: "v0.107.77"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并安装基础打包依赖（无需安装 qemu-utils）
      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y zstd make build-essential curl wget tar

      # 3. 缓存 ImageBuilder 工具
      - name: Cache ImageBuilder
        id: cache-ib
        uses: actions/cache@v4
        with:
          path: builder
          key: ib-${{ env.IMMORTALWRT_VER }}-armsr-armv8

      # 4. 下载并解压 ImageBuilder
      - name: Download & Extract ImageBuilder
        if: steps.cache-ib.outputs.cache-hit != 'true'
        run: |
          IB_URL="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VER}/targets/armsr/armv8/immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armsr-armv8.Linux-x86_64.tar.zst"
          wget -qO- "$IB_URL" | tar -I zstd -xv
          mv immortalwrt-imagebuilder-${IMMORTALWRT_VER}-armsr-armv8.Linux-x86_64 builder

      # 5. 下载并解压 AdGuard Home ARM64
      - name: Integrate AdGuard Home ARM64 Binary
        run: |
          mkdir -p builder/files/opt
          AGH_URL="https://github.com/AdguardTeam/AdGuardHome/releases/download/${ADGUARD_VER}/AdGuardHome_linux_arm64.tar.gz"
          curl -sSL "$AGH_URL" | tar -zx -C builder/files/opt/
          chmod +x builder/files/opt/AdGuardHome/AdGuardHome

      # 6. 配置 init.d 开机自启服务
      - name: Configure AdGuard Home Service Auto-start
        run: |
          mkdir -p builder/files/etc/init.d
          cat << 'EOF' > builder/files/etc/init.d/adguardhome
          #!/bin/sh /etc/rc.common

          START=99
          STOP=10

          USE_PROCD=1
          PROCD_DEBUG=1

          PROG=/opt/AdGuardHome/AdGuardHome
          WORK_DIR=/opt/AdGuardHome

          start_service() {
              procd_open_instance
              procd_set_param command $PROG -c $WORK_DIR/AdGuardHome.yaml -w $WORK_DIR
              procd_set_param respawn
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF

          chmod +x builder/files/etc/init.d/adguardhome

      # 7. 仅打包 RootFS (禁用所有虚拟机镜像构建)
      - name: Build RootFS with Packages
        run: |
          cd builder
          
          PACKAGES="luci \
            luci-i18n-base-zh-cn \
            luci-theme-argon \
            vsftpd openssh-sftp-server \
            luci-i18n-passwall-zh-cn xray-core sing-box \
            luci-i18n-smartdns-zh-cn \
            luci-app-vlmcsd \
            luci-i18n-softethervpn-zh-cn \
            curl wget-ssl ca-certificates iptables"

          # 通过 CONFIG_ 禁用 qcow2, vdi, vmdk, ext4/squashfs img 镜像生成，仅生成 rootfs.tar.gz
          make image PROFILE="generic" \
            PACKAGES="$PACKAGES" \
            FILES="files" \
            CONFIG_QCOW2_IMAGES=n \
            CONFIG_VDI_IMAGES=n \
            CONFIG_VMDK_IMAGES=n \
            CONFIG_TARGET_ROOTFS_EXT4FS=n \
            CONFIG_TARGET_ROOTFS_SQUASHFS=n \
            CONFIG_TARGET_ROOTFS_TARGZ=y \
            -j$(nproc)

      # 8. 仅上传生成的 RootFS tar.gz 归档包
      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-armsr-armv8-rootfs-${{ env.IMMORTALWRT_VER }}
          path: builder/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7
